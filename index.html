<html lang="en">
<head>

<title>Who's Your Daddy 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Playfair+Display:ital,wght@1,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: scoreboard band header + tabbed working surface; tables scroll inside their own frames. */
:root {
  --bg: #edf1eb; --surface: #ffffff; --surface-2: #f5f8f3; --ink: #13241a; --muted: #5a6a60; --line: #d3dcd2;
  --band: #17462e; --band-ink: #f1f6f0; --band-muted: #a9c4b2;
  --pine: #1d5a3a; --pine-ink: #ffffff; --pine-soft: #e1ede4;
  --red: #c0392b; --gold: #8f6210; --gold-bg: #fbf0d8; --warn: #9a5a00; --warn-bg: #fdf1df;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1410; --surface: #151f19; --surface-2: #1a261f; --ink: #e3ebe4; --muted: #8fa195; --line: #2a3a30;
  --band: #10301f; --band-ink: #eef4ef; --band-muted: #8fb39c;
  --pine: #5cbf86; --pine-ink: #0c1a12; --pine-soft: #1c3426;
  --red: #ff7b6b; --gold: #e2b55a; --gold-bg: #2b2413; --warn: #f0b052; --warn-bg: #2d2412; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1410; --surface: #151f19; --surface-2: #1a261f; --ink: #e3ebe4; --muted: #8fa195; --line: #2a3a30;
  --band: #10301f; --band-ink: #eef4ef; --band-muted: #8fb39c;
  --pine: #5cbf86; --pine-ink: #0c1a12; --pine-soft: #1c3426;
  --red: #ff7b6b; --gold: #e2b55a; --gold-bg: #2b2413; --warn: #f0b052; --warn-bg: #2d2412; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.band .wrap { padding-block: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand .sub { color: var(--band-muted); font-size: 13px; margin-top: 4px; }
.status { font-family: var(--font-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 3px; border: 1px solid var(--band-muted); color: var(--band-ink); white-space: nowrap; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; background: none; border: 0; color: var(--band-muted); padding: 8px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--band-ink); border-bottom-color: var(--band-ink); }
nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--pine); outline-offset: 1px; }

main { padding-block: 18px 48px; display: flex; flex-direction: column; gap: 18px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1.1; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .03em; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; line-height: 1.15; }
.chip small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.chip[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--pine-ink); }
.chip[aria-pressed="true"] small { color: var(--pine-ink); opacity: .8; }
.pill { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; display: inline-block; }
.pill.final { background: var(--pine); color: var(--pine-ink); }
.pill.live { background: var(--warn-bg); color: var(--warn); }
.banner { border: 1px solid var(--line); background: var(--gold-bg); border-radius: 6px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner p { margin: 0; max-width: 62ch; }

button.btn { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--pine); border-color: var(--pine); color: var(--pine-ink); }
button.btn.danger { color: var(--red); border-color: var(--red); }
button.btn.danger.armed { background: var(--red); color: var(--surface); }
button.btn:disabled { opacity: .5; cursor: default; }
button.link { background: none; border: 0; color: var(--red); cursor: pointer; font-size: 13px; padding: 4px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0; }
input:disabled, select:disabled { opacity: .75; }
textarea { width: 100%; min-height: 110px; font-family: var(--font-body); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
label.f input, label.f select { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 15px; color: var(--ink); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
td.wrap-cell { white-space: normal; min-width: 180px; }
.pos { font-family: var(--font-display); font-weight: 700; font-size: 20px; width: 48px; }
.score { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.under { color: var(--red); }
.money { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--gold); }
.money.zero { color: var(--muted); font-weight: 500; }
tr.paid td { background: color-mix(in srgb, var(--gold-bg) 55%, transparent); }
.each { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-body); font-weight: 400; }

/* Scorecard grid */
.card { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.card th, .card td { padding: 4px 3px; text-align: center; border-bottom: 1px solid var(--line); }
.card th:first-child, .card td:first-child { text-align: left; padding-left: 10px; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 130px; max-width: 170px; white-space: normal; }
.card th:first-child { background: var(--surface-2); }
.card .tot { font-family: var(--font-display); font-weight: 700; font-size: 17px; min-width: 40px; background: var(--surface-2); }
.card tr.meta td { font-size: 12px; color: var(--muted); }
.card tr.team td { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--pine); }
.cell { position: relative; display: inline-block; }
.cell input { width: 36px; height: 36px; text-align: center; padding: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; border-radius: 4px; }
.cell input.birdie { border: 1.5px solid var(--red); border-radius: 50%; color: var(--red); }
.cell input.eagle { border: 3px double var(--red); border-radius: 50%; color: var(--red); }
.cell input.bogey { border: 1.5px solid var(--ink); border-radius: 0; }
.cell input.dbl { border: 3px double var(--ink); border-radius: 0; }
.pop { position: absolute; top: 2px; right: 3px; font-size: 9px; line-height: 1; color: var(--pine); pointer-events: none; letter-spacing: -1px; }
.pname { font-weight: 600; display: block; }
.pmeta { font-size: 12px; color: var(--muted); }

.teamlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.teambtn { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: pointer; color: var(--ink); font: inherit; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.teambtn[aria-pressed="true"] { border-color: var(--pine); box-shadow: inset 0 0 0 1px var(--pine); background: var(--pine-soft); }
.teambtn .t { min-width: 0; font-size: 14px; }
.teambtn .t b { display: block; font-family: var(--font-display); font-size: 15px; letter-spacing: .04em; }
.thru { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.thru.done { color: var(--pine); }

.teamcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.teamcard { border: 1px solid var(--line); border-radius: 5px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.teamcard b { font-family: var(--font-display); letter-spacing: .05em; font-size: 15px; }
.teamcard select { width: 100%; }
.teamcard select.dup { border-color: var(--red); }
.skin { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.skin:last-child { border-bottom: 0; }
.hole { font-family: var(--font-display); font-weight: 700; font-size: 16px; width: 54px; display: inline-block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 5px; z-index: 20; max-width: calc(100% - 32px); }
.empty { padding: 22px; text-align: center; color: var(--muted); }
.kpis { display: flex; gap: 24px; flex-wrap: wrap; }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; }
.kpi .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ok { color: var(--pine); } .bad { color: var(--red); }
.placelist { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.placelist label.f input { width: 78px; }
.siinput { width: 38px; text-align: center; padding: 4px 2px; }
@media (max-width: 600px) { .brand h1 { font-size: 25px; } nav.tabs button { font-size: 16px; padding: 8px 10px 10px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== Clubhouse scoreboard — modeled on a major-championship hand-operated leaderboard.
   Deliberately one look in both themes: green frame, white slats, red under par, green over. */
:root {
  --m-frame: #0e4a2b; --m-frame-2: #145c37; --m-slat: #fdfcf6; --m-ink: #171717; --m-rule: #d8d4c3;
  --m-under: #c3122f; --m-over: #146a3c; --m-gold: #e9c869; --m-flash: #fff1a8; --m-dim: #6f7a70;
  --font-board: 'Playfair Display', Georgia, 'Times New Roman', serif;
}
.bd { container-type: inline-size; background: var(--m-frame); color: #fff; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 4px var(--m-frame-2); }
.bd-ctl { display: flex; flex-direction: column; gap: 10px; }
.bd-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--m-gold); padding-bottom: 10px; }
.bd-kicker { font-family: var(--font-display); letter-spacing: .28em; text-transform: uppercase; font-size: .78em; color: var(--m-gold); }
.bd-name { font-family: var(--font-board); font-style: italic; font-weight: 800; font-size: 2.6em; line-height: 1; color: #fff; text-wrap: balance; }
.bd-sub { font-family: var(--font-display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: .95em; color: #d5e6da; margin-top: 4px; }
.bd-live { font-family: var(--font-display); font-weight: 700; font-size: 1.3em; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.bd-live small { display: block; width: 100%; text-align: right; font-weight: 500; font-size: .62em; letter-spacing: .08em; color: #cfe0d4; }
.bd-dot { width: .6em; height: .6em; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 0 0 rgba(255,77,77,.6); animation: bdpulse 1.6s infinite; }
.bd-dot.done { background: var(--m-gold); animation: none; }
@keyframes bdpulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,77,.55); } 70% { box-shadow: 0 0 0 .55em rgba(255,77,77,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); } }
.bd-main { display: grid; grid-template-columns: minmax(0, 1fr) 17em; gap: 14px; align-items: start; }
.bd-main.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.bd-board { --cols: 3.9em minmax(9em, 1fr) repeat(18, var(--hw, 2.4em)) 3.2em 4.4em; display: flex; flex-direction: column; gap: 3px; background: var(--m-frame-2); padding: 3px; border-radius: 3px; min-width: 0; font-variant-numeric: tabular-nums; }
.bd-board.has-pay { --cols: 3.9em minmax(9em, 1fr) repeat(18, var(--hw, 2.4em)) 3.2em 4.4em 4.6em; }
.bd-board.wk { --cols: 3.9em minmax(0, 1fr) 3.2em 3.2em 3.2em 4em; }
.bd-row { display: grid; grid-template-columns: var(--cols); align-items: center; background: var(--m-slat); color: var(--m-ink); min-height: 2.25em; }
.bd-row .c { padding: 0 .3em; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--m-rule); line-height: 2.1; }
.bd-row .c:first-child { border-left: 0; }
.bd-row .c.nm { text-align: left; text-transform: uppercase; letter-spacing: .04em; font-size: 1.1em; padding-left: .55em; white-space: normal; line-height: 1.15; padding-block: .3em; overflow-wrap: anywhere; }
.bd-row .c.h { padding: 0; }
.bd:not(.tv) .bd-board:not(.wk):not(.pr) { font-size: 14px; --hw: 2.2em; }
.bd-row .c.turn { border-left: 2px solid var(--m-frame); }
.bd-row .c.pos { font-size: 1.1em; padding: 0 .15em; text-overflow: clip; }
.bd-row .c.tp { font-size: 1.35em; }
.bd-row .c.pay { color: #8a6410; }
.bd-row .u { color: var(--m-under); }
.bd-row .o { color: var(--m-over); }
.bd-row.hdr { background: var(--m-frame); color: #fff; min-height: 1.9em; }
.bd-row.hdr .c { border-left-color: rgba(255,255,255,.18); font-size: .85em; letter-spacing: .06em; text-overflow: clip; text-transform: uppercase; line-height: 2.2; }
.bd-row.par .c { color: var(--m-dim); font-size: .95em; }
.bd-row.inmoney .c.nm { box-shadow: inset .3em 0 0 var(--m-gold); }
.bd-row .pz { font-style: normal; color: #8a6410; font-size: .85em; letter-spacing: 0; }
.bd-row.flash { animation: bdflash 3.5s ease-out; }
@keyframes bdflash { 0%, 30% { background: var(--m-flash); } 100% { background: var(--m-slat); } }
.bd-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bd-box { background: var(--m-frame-2); border: 1px solid rgba(255,255,255,.12); border-radius: 4px; padding: .6em .8em; display: flex; flex-direction: column; gap: 2px; }
.bd-box-h { font-family: var(--font-display); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--m-gold); font-size: 1.05em; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid rgba(255,255,255,.2); padding-bottom: 4px; margin-bottom: 2px; }
.bd-box-h span { color: #cfe0d4; font-weight: 500; letter-spacing: .04em; font-size: .85em; }
.bd-li { display: grid; grid-template-columns: 4.8em minmax(0, 1fr) auto; gap: 6px; font-size: .98em; line-height: 1.55; }
.bd-li b { font-family: var(--font-display); color: var(--m-gold); letter-spacing: .04em; }
.bd-li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-li em { font-style: normal; font-family: var(--font-display); font-weight: 600; color: #fff; }
.bd-li.dim { color: #a9c2b1; display: block; }
.bd-tvbar { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; opacity: .35; transition: opacity .2s; z-index: 15; pointer-events: none; }
.bd-tvbar:hover, .bd-tvbar:focus-within { opacity: 1; }
.tvseg { display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 5px; overflow: hidden; background: rgba(10,40,24,.92); pointer-events: auto; }
.tvb { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #e6efe8; background: none; border: 0; border-left: 1px solid rgba(255,255,255,.18); padding: 8px 12px; cursor: pointer; }
.tvb:first-child { border-left: 0; }
.tvb.on { background: var(--m-gold); color: #10301e; }
.tvb:focus-visible { outline: 2px solid var(--m-gold); outline-offset: -2px; }
@container (max-width: 1300px) { .bd:not(.tv) .bd-main:not(.two) { grid-template-columns: minmax(0, 1fr); } .bd:not(.tv) .bd-side { flex-direction: row; flex-wrap: wrap; } .bd:not(.tv) .bd-side .bd-box { flex: 1 1 15em; } }
@container (max-width: 1000px) { .bd:not(.tv) .bd-row .c.h { display: none; } .bd:not(.tv) .bd-board { --cols: 3.9em minmax(0, 1fr) 3.2em 4.4em; } .bd:not(.tv) .bd-board.has-pay { --cols: 3.9em minmax(0, 1fr) 3.2em 4.4em 4.6em; } }
@container (max-width: 980px) { .bd-main { grid-template-columns: minmax(0, 1fr); } .bd-side { flex-direction: row; flex-wrap: wrap; } .bd-side .bd-box { flex: 1 1 15em; } }
@container (max-width: 760px) {
  .bd-board { --cols: 3em minmax(0, 1fr) 2.2em 3.2em; } .bd-board.has-pay { --cols: 3em minmax(0, 1fr) 2.2em 3.2em 3.8em; }
  .bd-row .c.nm { white-space: normal; line-height: 1.2; padding-block: .35em; font-size: 1em; }
  .bd-board.wk { --cols: 3em minmax(0, 1fr) 2.4em 2.4em 2.4em 3.2em; }
  .bd-row .c.h { display: none; } .bd-name { font-size: 2em; }
  .bd-main.two { grid-template-columns: minmax(0, 1fr); }
}
.bd-board.pr { --cols: 3.9em 2.6em minmax(0, 1fr) 3.4em 2.6em minmax(0, 1fr) 3.4em; }
.bd-board.pr .bd-row > .c:nth-child(5) { border-left: 3px solid var(--m-frame); }
.bd-row .c.sd { color: var(--m-dim); font-size: .9em; }
.bd-row .c.amp { font-family: var(--font-board); font-style: italic; color: var(--m-dim); }
.bd-row .c sup { font-size: .55em; color: var(--m-dim); margin-left: 1px; }
.bd-note { color: #cfe0d4; font-size: .85em; }
@container (max-width: 760px) { .bd-board.pr { --cols: 3em 0 minmax(0, 1fr) 2.8em 0 minmax(0, 1fr) 2.8em; }

/* TV view: fill the screen, size type from the screen height */

<script>
// ===== Scoring engine (pure functions) =====
const DAYS = ['fri', 'sat', 'sun'];
const FORMATS = {
  bb2:   { label: '2-Man Best Ball (Net)', size: 2, balls: 1, scramble: false },
  bb4x2: { label: '4-Man, 2 Best Balls (Net)', size: 4, balls: 2, scramble: false },
  scr2:  { label: '2-Man Scramble (Net)', size: 2, balls: 1, scramble: true },
};

function sum(a) { return a.reduce((s, v) => s + (v || 0), 0); }
function round2(n) { return Math.round(n * 100) / 100; }

function teeFor(state, pid, day) {
  const dc = state.config.days[day];
  const course = state.config.courses[dc.course];
  const p = state.players[pid];
  const want = p && p.tees && p.tees[day];
  return course.tees.find(t => t.id === want) || course.tees.find(t => t.id === course.defaultTee) || course.tees[0];
}

// WHS: Course Handicap = Index x Slope/113 + (Rating - Par), rounded; then allowance.
function courseHcp(index, tee) {
  return Math.round(index * tee.slope / 113 + (tee.rating - tee.par));
}
function playingHcp(index, tee, allowance) {
  const ch = courseHcp(index, tee);
  return Math.round(ch * (allowance == null ? 100 : allowance) / 100);
}

// Strokes received on a hole of stroke index `si` for playing handicap `ph`.
function pops(ph, si) {
  if (ph >= 0) return Math.floor(ph / 18) + (si <= ph % 18 ? 1 : 0);
  const p = -ph;
  return -(Math.floor(p / 18) + (si > 18 - (p % 18) ? 1 : 0));
}

function playerPH(state, pid, day) {
  const p = state.players[pid];
  if (!p) return 0;
  return playingHcp(Number(p.index) || 0, teeFor(state, pid, day), state.config.days[day].allowance);
}

function scrambleTeamHcp(state, pids, day) {
  const dc = state.config.days[day];
  const chs = pids.map(pid => {
    const p = state.players[pid];
    return p ? courseHcp(Number(p.index) || 0, teeFor(state, pid, day)) : 0;
  }).sort((a, b) => a - b);
  if (!chs.length) return 0;
  if (dc.scrHcp === '3515' && chs.length >= 2) {
    return Math.round(chs[0] * 0.35 + chs[chs.length - 1] * 0.15);
  }
  const pct = dc.scrPct == null ? 100 : dc.scrPct;
  return Math.round(sum(chs) / chs.length * pct / 100);
}

function cardOf(state, day, key) {
  const c = state.scores[day] && state.scores[day][key];
  return Array.isArray(c) ? c.map(v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v)) : new Array(18).fill(null);
}

function teamLabel(state, team) {
  return team.pids.map(pid => (state.players[pid] ? state.players[pid].name : '?')).join(' / ');
}

// Compare two hole-score arrays by matching cards: back 9, back 6, back 3, 18th.
function cardOff(a, b) {
  for (const n of [9, 6, 3, 1]) {
    const d = sum(a.slice(18 - n)) - sum(b.slice(18 - n));
    if (d !== 0) return d;
  }
  return 0;
}

function placeMoney(sorted, places, tieBreak, key) {
  // sorted: complete teams sorted by total (then card-off if chosen). Assign pos + money.
  let i = 0;
  while (i < sorted.length) {
    let j = i + 1;
    while (j < sorted.length && sorted[j].total === sorted[i].total &&
      (tieBreak !== 'cards' || cardOff(sorted[j][key], sorted[i][key]) === 0)) j++;
    let pot = 0;
    for (let k = i; k < j; k++) pot += Number(places[k]) || 0;
    for (let k = i; k < j; k++) {
      sorted[k].pos = i + 1;
      sorted[k].tied = j - i > 1;
      sorted[k].payout = round2(pot / (j - i));
    }
    i = j;
  }
}

function computeDay(state, day) {
  const dc = state.config.days[day];
  const fmt = FORMATS[dc.format] || FORMATS.bb2;
  const course = state.config.courses[dc.course];
  const pars = course.pars, si = course.si;
  const coursePar = sum(pars);
  const teams = ((state.teams && state.teams[day]) || []).filter(t => t.pids && t.pids.some(Boolean))
    .map(t => ({ ...t, pids: t.pids.filter(pid => pid && state.players[pid]) }))
    .filter(t => t.pids.length);
  const money = {};
  const add = (pid, amt, why) => {
    if (!amt) return;
    (money[pid] = money[pid] || { total: 0, items: [] });
    const a = Math.round(amt + 1e-9); // payouts are whole dollars
    money[pid].total = round2(money[pid].total + a);
    money[pid].items.push({ why, amt: a });
  };

  // Units for skins: individuals (best ball days) or teams (scramble).
  const units = [];
  const rows = teams.map(t => {
    const row = { id: t.id, pids: t.pids, name: teamLabel(state, t), holes: new Array(18).fill(null), members: [] };
    if (fmt.scramble) {
      const ph = scrambleTeamHcp(state, t.pids, day);
      const gross = cardOf(state, day, t.id);
      const net = gross.map((g, h) => g == null ? null : g - pops(ph, si[h]));
      row.ph = ph;
      row.gross = gross;
      row.holes = gross.slice();
      row.thru = gross.filter(v => v != null).length;
      row.grossTotal = sum(gross);
      row.total = row.thru === 18 ? row.grossTotal - ph : null;
      row.toPar = row.total == null ? null : row.total - coursePar;
      units.push({ key: t.id, pids: t.pids, name: row.name, gross, net });
    } else {
      row.members = t.pids.map(pid => {
        const ph = playerPH(state, pid, day);
        const gross = cardOf(state, day, pid);
        const net = gross.map((g, h) => g == null ? null : g - pops(ph, si[h]));
        units.push({ key: pid, pids: [pid], name: state.players[pid].name, gross, net });
        return { pid, ph, gross, net };
      });
      for (let h = 0; h < 18; h++) {
        const nets = row.members.map(m => m.net[h]);
        if (nets.some(v => v == null)) continue;
        nets.sort((a, b) => a - b);
        row.holes[h] = sum(nets.slice(0, fmt.balls));
      }
      row.thru = row.holes.filter(v => v != null).length;
      row.total = row.thru === 18 ? sum(row.holes) : null;
      row.toPar = row.total == null ? null : row.total - coursePar * fmt.balls;
      row.running = sum(row.holes);
      row.runningPar = sum(pars.filter((_, h) => row.holes[h] != null)) * fmt.balls;
    }
    return row;
  });
  if (fmt.scramble) rows.forEach(r => {
    r.running = r.holes.reduce((s, g, h) => s + (g == null ? 0 : g - pops(r.ph, si[h])), 0);
    r.runningPar = sum(pars.filter((_, h) => r.holes[h] != null));
  });

  const complete = rows.filter(r => r.thru === 18);
  const allIn = rows.length > 0 && complete.length === rows.length;
  const tieBreak = state.config.tieBreak || 'split';
  const keyFor = fmt.scramble ? 'holes' : 'holes';
  // For scramble card-off, compare net holes.
  if (fmt.scramble) rows.forEach(r => { r.netHoles = units.find(u => u.key === r.id).net; });
  const cmpKey = fmt.scramble ? 'netHoles' : 'holes';
  complete.sort((a, b) => a.total - b.total || (tieBreak === 'cards' ? cardOff(a[cmpKey], b[cmpKey]) : 0));
  placeMoney(complete, dc.places || [], tieBreak, cmpKey);
  complete.forEach(r => {
    if (!r.payout) return;
    r.each = Math.round(r.payout / r.pids.length + 1e-9);
    r.payout = r.each * r.pids.length;
    const each = r.each;
    r.pids.forEach(pid => add(pid, each, `${ordinal(r.pos)}${r.tied ? ' (tie)' : ''} place`));
  });
  const incomplete = rows.filter(r => r.thru !== 18).sort((a, b) => (b.thru - a.thru) || ((a.running - a.runningPar) - (b.running - b.runningPar)));
  const standings = complete.concat(incomplete);

  // Skins, played hole by hole in order.
  //   1 low score  -> full skin (plus any carryover)
  //   2 tied low   -> half skin each (of the hole's value incl. carryover)
  //   3+ tied low  -> no skin; the hole's value carries to the next hole
  // Scoring: 'netGrossP3' = net, but gross on par 3s (default); 'net'; 'gross'.
  const skinsType = dc.skinsType || 'netGrossP3';
  const skins = [], carries = [];
  let carry = 0, units_awarded = 0, skinHolesDecided = 0, carryOut = 0;
  for (let h = 0; h < 18; h++) {
    const useGross = skinsType === 'gross' || (skinsType === 'netGrossP3' && pars[h] === 3);
    const scored = units.map(u => ({ u, s: (useGross ? u.gross : u.net)[h] })).filter(x => x.s != null);
    const holeComplete = units.length > 0 && scored.length === units.length;
    if (holeComplete) skinHolesDecided++;
    if (!scored.length) continue;
    const worth = 1 + carry;
    const low = Math.min(...scored.map(x => x.s));
    const at = scored.filter(x => x.s === low);
    if (at.length <= 2) {
      skins.push({ hole: h + 1, par: pars[h], score: low, gross: useGross, worth, final: holeComplete,
        winners: at.map(x => ({ key: x.u.key, pids: x.u.pids, name: x.u.name, share: worth / at.length, grossScore: x.u.gross[h] })) });
      units_awarded += worth; carry = 0;
    } else {
      carries.push({ hole: h + 1, tied: at.length, score: low, worth, final: holeComplete });
      carry = worth;
    }
  }
  carryOut = carry; // value still carrying after the last scored hole (unclaimed)
  const skinsPot = Number(dc.skinsPot) || 0;
  const skinValue = units_awarded ? Math.floor(skinsPot / units_awarded * 100) / 100 : 0;
  skins.forEach(s => s.winners.forEach(w => {
    const piece = Math.round(skinValue * w.share / w.pids.length + 1e-9);
    w.amt = piece * w.pids.length;
    w.pids.forEach(pid => add(pid, piece, `${w.share < s.worth ? 'Half skin' : 'Skin'} #${s.hole}`));
  }));

  // Contests (CTP / LD) — winners entered manually.
  const contests = (dc.contests || []).map(c => {
    const pid = state.extras && state.extras[day] && state.extras[day][c.id];
    const winner = pid && state.players[pid] ? pid : null;
    if (winner) add(winner, Number(c.amt) || 0, `${c.type} #${c.hole}`);
    return { ...c, winner };
  });

  const placesTotal = sum((dc.places || []).map(Number));
  const contestsTotal = sum((dc.contests || []).map(c => Number(c.amt) || 0));
  return {
    day, fmt, course, coursePar, standings, complete: allIn, cardsIn: complete.length, cardsTotal: rows.length,
    skins, carries, carryOut, skinUnits: units_awarded, skinValue, skinsPot, skinsType, skinHolesDecided, contests, money,
    allocated: placesTotal + skinsPot + contestsTotal,
  };
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// Individual net totals across given days (used for Sunday pairing).
function individualNet(state, days) {
  return Object.keys(state.players).map(pid => {
    const p = state.players[pid];
    let total = 0, rounds = 0, detail = {};
    for (const day of days) {
      const card = cardOf(state, day, pid);
      if (card.some(v => v == null)) { detail[day] = null; continue; }
      const net = sum(card) - playerPH(state, pid, day);
      detail[day] = net; total += net; rounds++;
    }
    return { pid, name: p.name, index: Number(p.index) || 0, total, rounds, detail };
  }).sort((a, b) => (b.rounds - a.rounds) || (a.total - b.total) || (a.index - b.index) || a.name.localeCompare(b.name));
}

function sundayPairs(state) {
  const ranked = individualNet(state, ['fri', 'sat']);
  const n = ranked.length, teams = [];
  for (let i = 0; i < Math.floor(n / 2); i++) {
    teams.push({ id: 'S' + (i + 1), pids: [ranked[i].pid, ranked[n - 1 - i].pid] });
  }
  if (n % 2) teams.push({ id: 'S' + (teams.length + 1), pids: [ranked[Math.floor(n / 2)].pid] });
  return { teams, ranked };
}

// Weekend individual standings: Fri net + Sat net + his Sunday team's net.
function weekendStandings(state, sunDay) {
  const sun = sunDay || computeDay(state, 'sun');
  const sunNet = {};
  sun.standings.forEach(t => { if (t.thru === 18) t.pids.forEach(pid => { sunNet[pid] = t.total; }); });
  const rows = individualNet(state, ['fri', 'sat']).map(r => {
    const s = sunNet[r.pid];
    const rounds = r.rounds + (s != null ? 1 : 0);
    return { pid: r.pid, name: r.name, index: r.index, fri: r.detail.fri, sat: r.detail.sat, sun: s ?? null, rounds, total: r.total + (s ?? 0) };
  });
  const done = rows.filter(r => r.rounds === 3).sort((a, b) => a.total - b.total);
  const rest = rows.filter(r => r.rounds !== 3).sort((a, b) => b.rounds - a.rounds || a.total - b.total);
  const places = (state.config.weekend && state.config.weekend.places) || [];
  let i = 0;
  while (i < done.length) {
    let j = i + 1;
    while (j < done.length && done[j].total === done[i].total) j++;
    let pot = 0; for (let k = i; k < j; k++) pot += Number(places[k]) || 0;
    for (let k = i; k < j; k++) { done[k].pos = i + 1; done[k].tied = j - i > 1; done[k].payout = Math.round(pot / (j - i) + 1e-9); }
    i = j;
  }
  return { list: done.concat(rest), complete: rows.length > 0 && done.length === rows.length, places };
}

function tripMoney(state) {
  const per = {};
  const days = {};
  const blank = () => ({ fri: 0, sat: 0, sun: 0, wknd: 0, total: 0 });
  for (const d of DAYS) {
    days[d] = computeDay(state, d);
    for (const [pid, m] of Object.entries(days[d].money)) {
      (per[pid] = per[pid] || blank());
      per[pid][d] = m.total; per[pid].total = round2(per[pid].total + m.total);
    }
  }
  const weekend = weekendStandings(state, days.sun);
  weekend.list.forEach(r => { if (r.payout) { (per[r.pid] = per[r.pid] || blank()); per[r.pid].wknd = r.payout; per[r.pid].total = round2(per[r.pid].total + r.payout); } });
  const buyIn = Number(state.config.buyIn) || 0;
  const list = Object.keys(state.players).map(pid => {
    const m = per[pid] || blank();
    return { pid, name: state.players[pid].name, ...m, net: round2(m.total - buyIn) };
  }).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  return { list, days, weekend };
}


// ===== Default trip setup + sample data =====
function defaultConfig() {
  const par3 = (pars) => pars.map((p, i) => p === 3 ? i + 1 : null).filter(Boolean);
  const courses = {
    fallen: {
      name: 'Fallen Oak', city: 'Saucier, MS',
      pars: [5,4,3,4,4,5,4,3,4, 4,4,4,5,3,5,4,3,4],
      si:   [7,3,13,11,1,9,17,15,5, 8,10,16,4,18,2,14,12,6],
      tees: [
        { id: 't1', name: 'Tee 1 · 7,487 yds', rating: 76.5, slope: 142, par: 72 },
        { id: 't2', name: 'Tee 2 · 6,938 yds', rating: 73.7, slope: 141, par: 72 },
        { id: 't3', name: 'Tee 3 · 6,549 yds', rating: 71.7, slope: 138, par: 72 },
        { id: 't4', name: 'Tee 4 · 6,133 yds', rating: 69.4, slope: 133, par: 72 },
      ],
      defaultTee: 't3',
    },
    shell: {
      name: 'Shell Landing', city: 'Gautier, MS',
      pars: [4,3,5,4,4,4,5,3,4, 4,3,4,5,4,4,5,3,4],
      si:   [9,17,3,11,13,1,7,15,5, 12,18,10,8,2,14,6,16,4],
      tees: [
        { id: 'snap', name: 'Snapping (Black)', rating: 73.8, slope: 134, par: 72 },
        { id: 'leat', name: 'Leatherback (Gold)', rating: 71.2, slope: 129, par: 72 },
        { id: 'hawk', name: 'Hawksbill (Blue)', rating: 69.2, slope: 119, par: 72 },
        { id: 'goph', name: 'Gopher (White)', rating: 66.6, slope: 115, par: 72 },
      ],
      defaultTee: 'leat',
    },
    windance: {
      name: 'Windance', city: 'Gulfport, MS',
      pars: [4,3,5,3,4,4,5,3,4, 4,4,5,4,4,3,5,4,4],
      si:   [8,6,2,18,4,14,10,16,12, 5,3,9,13,11,15,1,17,7],
      tees: [
        { id: 'blue', name: 'Blue', rating: 72.3, slope: 127, par: 72 },
        { id: 'white', name: 'White', rating: 69.5, slope: 125, par: 72 },
        { id: 'green', name: 'Green', rating: 66.2, slope: 111, par: 72 },
      ],
      defaultTee: 'blue',
    },
  };
  const contests = (course, ld) => par3(courses[course].pars).map((h, i) => ({ id: 'c' + h, type: 'CTP', hole: h, amt: 25 }))
    .concat([{ id: 'ld' + ld, type: 'LD', hole: ld, amt: 40 }]);
  return {
    buyIn: 105,
    tieBreak: 'split',
    courses,
    weekend: { places: [200, 120, 80] },
    days: {
      fri: { label: 'Friday', course: 'fallen', format: 'bb2', allowance: 100, places: [200, 150, 110, 80, 60], skinsPot: 250, skinsType: 'netGrossP3', contests: contests('fallen', 13) },
      sat: { label: 'Saturday', course: 'shell', format: 'bb4x2', allowance: 100, places: [300, 180, 110], skinsPot: 250, skinsType: 'netGrossP3', contests: contests('shell', 16) },
      sun: { label: 'Sunday', course: 'windance', format: 'scr2', allowance: 100, scrHcp: 'avg', scrPct: 100, places: [200, 150, 110, 80, 60], skinsPot: 250, skinsType: 'netGrossP3', contests: contests('windance', 12) },
    },
  };
}

// Realistic test scores. A player's average gross runs about 3 over his course handicap,
// with more of the damage on the harder (low stroke-index) holes and more scatter for higher handicaps.
function makeTestScores(state, seedIn) {
  let seed = seedIn || 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const normal = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
  const cfg = state.config;
  const card = (course, ch, extra, sdMul) => {
    const over = ch + extra; // expected strokes over par for the round
    const w = course.si.map(si => 1 + 0.7 * (9.5 - si) / 8.5);
    const wsum = w.reduce((a, b) => a + b, 0);
    const sd = (0.55 + Math.max(0, ch) * 0.02) * (sdMul || 1);
    return course.pars.map((par, h) => {
      const exp = par + over * w[h] / wsum;
      const s = Math.round(exp + normal() * sd);
      return Math.max(Math.max(2, par - 2), Math.min(par + 5, s));
    });
  };
  const scores = { fri: {}, sat: {}, sun: {} };
  for (const day of ['fri', 'sat']) {
    const course = cfg.courses[cfg.days[day].course];
    for (const pid of Object.keys(state.players)) {
      const ch = courseHcp(Number(state.players[pid].index) || 0, teeFor(state, pid, day));
      scores[day][pid] = card(course, ch, 3 + normal() * 1.5);
    }
  }
  const sunCourse = cfg.courses[cfg.days.sun.course];
  for (const t of (state.teams.sun || [])) {
    const chs = t.pids.filter(p => state.players[p]).map(p => courseHcp(Number(state.players[p].index) || 0, teeFor(state, p, 'sun'))).sort((a, b) => a - b);
    if (!chs.length) continue;
    // 2-man scramble: roughly 35% of the low man's + 15% of the high man's handicap over par, minus ~3.
    const over = 0.35 * chs[0] + 0.15 * chs[chs.length - 1] - 2 + normal() * 1.5;
    scores.sun[t.id] = card(sunCourse, 0, over, 0.75);
  }
  return scores;
}

function makeSample() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const first = ['Cody','Travis','Wes','Brandon','Kyle','Dustin','Garrett','Shane','Clay','Brent','Tyler','Jared','Colby','Derek','Lance','Russ','Trey','Blake','Chase','Grant','Heath','Jace','Kirk','Luke','Mason','Nate','Owen','Reid','Seth','Tate','Vince','Walt'];
