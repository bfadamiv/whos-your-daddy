async function deleteAll() {
  if (backend === 'local') { docs = {}; saveLocal(); deriveState(); render(); return; }
  for (const id of DOC_IDS) { try { await db.collection('trip').doc(id).delete(); } catch (e) {} }
}
function askPin() { if (backend !== 'db') return; ui.pinOpen = true; render(); setTimeout(() => { const el = document.getElementById('pin-in'); if (el) el.focus(); }, 30); }
async function submitPin() {
  const el = document.getElementById('pin-in'); const pin = el ? el.value.trim() : '';
  if (!pin) return toast('Type the PIN first.');
  if (!authId) return toast('Still connecting. Try again in a moment.');
  try {
    await db.collection('editors').doc(authId).set({ pin });
    canWrite = true; ui.pinOpen = false; toast('Scorekeeper mode is on for this device.'); render();
  } catch (e) { toast("That PIN didn't work. Check with the host."); }
}
function exportTrip() {
  const out = {}; DOC_IDS.forEach(id => { if (docs[id]) out[id] = docs[id]; });
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'whos-your-daddy-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function writeTrip(state) {
  await writeDoc('config', { cfg: state.config }, false);
  await writeDoc('players', { list: state.players }, false);
  await writeDoc('teams', { fri: state.teams.fri || [], sat: state.teams.sat || [], sun: state.teams.sun || [] }, false);
  for (const d of DAYS) await writeDoc('scores_' + d, { h: state.scores[d] || {} }, false);
  await writeDoc('extras', { fri: {}, sat: {}, sun: {}, ...(state.extras || {}) }, false);
}
const saveConfig = (cfg) => writeDoc('config', { cfg }, false);

// ---- render ----
function render() {
  const st = $('#status');
  st.textContent = mode === 'loading' ? 'Loading' : backend === 'local' ? 'Offline · this device only' : (canWrite ? 'Live · Scorekeeper' : mode === 'sample' ? 'Sample data' : 'Live · watching');
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  if (mode === 'loading') return;
  // keep focus + typed text across re-renders
  const a = document.activeElement, keep = a && a.id && $('#main').contains(a) ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  const views = { board: viewBoard, results: viewResults, scores: viewScores, players: viewPlayers, setup: viewSetup };
  document.body.classList.toggle('tv-mode', !!ui.tv && ui.tab === 'board');
  $('#main').innerHTML = (ui.tv && ui.tab === 'board' ? '' : banner()) + views[ui.tab]();
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { if ('value' in el && el.tagName !== 'SELECT' && el.value !== keep.v) el.value = keep.v; el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  }
}

function banner() {
  let out = '';
  if (ui.pinOpen && !canWrite) out += `<section class="banner" role="dialog" aria-labelledby="pin-h"><p id="pin-h"><b>Scorekeeper PIN.</b> Enter it once and this phone or computer can enter scores for the rest of the trip.</p>
    <form class="row" data-form="pin"><input id="pin-in" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN" style="width:110px"><button class="btn primary" type="submit">Unlock</button><button class="btn" type="button" data-act="pin-cancel">Cancel</button></form></section>`;
  if (ui.importData) out += `<section class="banner" role="alertdialog" aria-labelledby="imp-h"><p id="imp-h"><b>Are you sure?</b> Importing <b>${esc(ui.importName || 'this file')}</b> replaces all players, teams, scores and setup with what's in the file.</p>
    <div class="row"><button class="btn" data-act="imp-cancel">Cancel</button><button class="btn primary" data-act="imp-yes">Yes, import it</button></div></section>`;
  if (mode === 'sample') return out + `<div class="banner"><p><b>You're looking at a made-up sample trip</b> (32 fake players, all three rounds scored) so you can see how results and payouts come out.${canWrite ? ' Start your real trip, or import a trip file.' : ' The host will load the real trip soon.'}</p>
    <div class="row">${canWrite ? `<button class="btn primary" data-act="start">Start my trip</button><label class="btn" for="imp-file">Import a trip file</label><input type="file" id="imp-file" accept=".json,application/json" hidden><button class="btn" data-act="load-sample">Save sample to test with</button>` : `<button class="btn" data-act="pin-open">Scorekeeper? Enter PIN</button>`}</div></div>`;
  if (!canWrite && !ui.pinOpen) return out + `<div class="banner"><p>Watching live. Results update as cards are entered.</p><div class="row"><button class="btn" data-act="pin-open">Scorekeeper? Enter PIN</button></div></div>`;
  return out;
}
const dis = () => (mode !== 'live' || !canWrite) ? 'disabled' : '';

function dayChips(sel, act, withTrip) {
  const c = S.config;
  const chips = DAYS.map(d => `<button class="chip" aria-pressed="${sel === d}" data-act="${act}" data-day="${d}">${DAY_LABEL[d]}<small>${esc(c.courses[c.days[d].course].name)}</small></button>`);
  if (withTrip) chips.push(`<button class="chip" aria-pressed="${sel === 'trip'}" data-act="${act}" data-day="trip">Trip Totals<small>Money list &amp; seeding</small></button>`);
  return `<div class="chips">${chips.join('')}</div>`;
}

function viewResults() {
  if (!Object.keys(S.players).length) return dayChips(ui.rday, 'rday', true) + `<div class="panel empty">No players yet. Add them under Players &amp; Teams.</div>`;
  if (ui.rday === 'trip') return dayChips('trip', 'rday', true) + viewTrip();
  const r = computeDay(S, ui.rday), dc = S.config.days[ui.rday];
  const status = r.cardsTotal === 0 ? `<span class="pill live">No teams set</span>` : r.complete ? `<span class="pill final">Final</span>` : `<span class="pill live">${r.cardsIn} of ${r.cardsTotal} cards in</span>`;
  const scr = r.fmt.scramble;
  const rows = r.standings.map(t => {
    const done = t.thru === 18;
    const running = done ? t.toPar : (t.thru ? t.running - t.runningPar : null);
    return `<tr class="${t.payout ? 'paid' : ''}">
      <td class="pos">${done ? (t.tied ? 'T' : '') + t.pos : '–'}</td>
      <td class="wrap-cell">${esc(t.name)}</td>
      <td class="num thru ${done ? 'done' : ''}">${done ? 'F' : t.thru}</td>
      ${scr ? `<td class="num">${t.thru ? t.grossTotal : ''}</td><td class="num">${t.ph}</td>` : ''}
      <td class="num score">${done ? t.total : ''}</td>
      <td class="num score ${running < 0 ? 'under' : ''}">${toParStr(running)}</td>
      <td class="num">${t.payout ? `<span class="money">${fmt$(t.payout)}</span><span class="each">${fmt$(t.each)} each</span>` : ''}</td></tr>`;
  }).join('');
  const skinLine = (s) => s.winners.map(w => `<div class="skin"><span><span class="hole">#${s.hole}</span>${esc(w.name)} <span class="muted small">${s.gross ? 'gross' : 'net'} ${s.score}${!s.gross && w.grossScore !== s.score ? ' (gross ' + w.grossScore + ')' : ''} on par ${s.par}${s.worth > 1 ? ' · worth ' + s.worth + ' skins with carryover' : ''}${s.winners.length === 2 ? ' · half skin, tied' : ''}</span>${s.final ? '' : ' <span class="pill live">pending</span>'}</span><span class="money">${fmt$(w.amt)}</span></div>`).join('');
  const carryNote = r.carries.length ? `<div class="muted small">Carried: ${r.carries.map(c => '#' + c.hole + ' (' + c.tied + '-way tie at ' + c.score + ')').join(', ')}${r.carryOut ? `. ${r.carryOut} skin${r.carryOut > 1 ? 's' : ''} still carrying after the last hole scored.` : '.'}</div>` : '';
  const skins = (r.skins.length ? r.skins.map(skinLine).join('') : `<div class="muted">No skins won yet.</div>`) + carryNote;
  const contests = r.contests.length ? r.contests.map(c => `<div class="skin"><span><span class="hole">${c.type} #${c.hole}</span>${c.winner ? esc(S.players[c.winner].name) : '<span class="muted">Not entered</span>'}</span><span class="money ${c.winner ? '' : 'zero'}">${fmt$(c.amt)}</span></div>`).join('') : `<div class="muted">None set for this day.</div>`;
  const money = Object.entries(r.money).sort((a, b) => b[1].total - a[1].total).map(([pid, m]) =>
    `<tr><td>${esc(S.players[pid].name)}</td><td class="wrap-cell muted small">${m.items.map(i => esc(i.why) + ' ' + fmt$(i.amt)).join(' · ')}</td><td class="num money">${fmt$(m.total)}</td></tr>`).join('');
  const paidOut = Object.values(r.money).reduce((s, m) => s + m.total, 0);
  return dayChips(ui.rday, 'rday', true) + `
  <section class="panel">
    <div class="row between"><div><h2>${DAY_LABEL[ui.rday]} · ${esc(r.course.name)}</h2><div class="muted small">${esc(r.fmt.label)} · Par ${r.coursePar}${r.fmt.balls > 1 ? ' (' + r.coursePar * r.fmt.balls + ' for 2 balls)' : ''}${scr ? ' · Team handicap: ' + (dc.scrHcp === '3515' ? '35% low + 15% high' : 'average of course handicaps' + (dc.scrPct != 100 ? ' × ' + dc.scrPct + '%' : '')) : ''}</div></div>${status}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Pos</th><th>Team</th><th class="num">Thru</th>${scr ? '<th class="num">Gross</th><th class="num">Hcp</th>' : ''}<th class="num">Net</th><th class="num">To Par</th><th class="num">Payout</th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="empty">Set teams under Players &amp; Teams.</td></tr>`}</tbody></table></div>
    ${r.complete ? '' : '<div class="muted small">Places and payouts settle as cards come in. Teams still on the course are listed below the finished ones.</div>'}
  </section>
  <div class="grid2">
    <section class="panel"><div class="row between"><h3>Skins · ${SKIN_LABEL[r.skinsType] || 'Net'}${scr ? ' (team)' : ''}</h3><span class="muted small">${fmt$(r.skinsPot)} pot${r.skinUnits ? ' · ' + r.skinUnits + ' skin' + (r.skinUnits === 1 ? '' : 's') + ' at about ' + fmt$(Math.round(r.skinValue)) : ''} · rounded to whole dollars</span></div>${skins}</section>
    <section class="panel"><div class="row between"><h3>Closest to Pin &amp; Long Drive</h3><span class="muted small">Enter winners on the score screen</span></div>${contests}</section>
  </div>
  <section class="panel"><div class="row between"><h3>${DAY_LABEL[ui.rday]} payouts by player</h3><span class="muted small">${fmt$(paidOut)} of ${fmt$(r.allocated)} paid</span></div>
    ${money ? `<div class="tbl-wrap"><table><thead><tr><th>Player</th><th>For</th><th class="num">Won</th></tr></thead><tbody>${money}</tbody></table></div>` : '<div class="muted">Nothing paid yet.</div>'}</section>`;
}

function weekendPanel(w) {
  const places = w.places || [];
  const dash = '<span class="muted">–</span>';
  const rows = w.list.map(r => `<tr class="${r.payout ? 'paid' : ''}"><td class="pos">${r.pos ? (r.tied ? 'T' : '') + r.pos : '–'}</td><td>${esc(r.name)}</td><td class="num">${r.fri ?? dash}</td><td class="num">${r.sat ?? dash}</td><td class="num">${r.sun ?? dash}</td><td class="num score">${r.rounds === 3 ? r.total : ''}</td><td class="num">${r.payout ? `<span class="money">${fmt$(r.payout)}</span>` : ''}</td></tr>`).join('');
  return `<section class="panel"><div class="row between"><div><h3>Weekend individual · top ${places.length}</h3><div class="muted small">Friday individual net + Saturday individual net + his Sunday scramble team's net. Pays ${places.map((p, i) => ordinal(i + 1) + ' ' + fmt$(p)).join(', ')}. Ties split.</div></div>${w.complete ? '<span class="pill final">Final</span>' : '<span class="pill live">In progress</span>'}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Pos</th><th>Player</th><th class="num">Fri net</th><th class="num">Sat net</th><th class="num">Sun team net</th><th class="num">Total</th><th class="num">Payout</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function viewTrip() {
  const tm = tripMoney(S);
  const buyIn = Number(S.config.buyIn) || 0;
  const rows = tm.list.map((p, i) => `<tr class="${p.total ? 'paid' : ''}"><td class="pos">${i + 1}</td><td>${esc(p.name)}</td>${DAYS.concat('wknd').map(d => `<td class="num">${p[d] ? fmt$(p[d]) : '<span class="muted">–</span>'}</td>`).join('')}<td class="num money ${p.total ? '' : 'zero'}">${fmt$(p.total)}</td><td class="num score ${p.net >= 0 ? 'ok' : 'muted'}">${p.net >= 0 ? '+' : '−'}${fmt$(Math.abs(p.net))}</td></tr>`).join('');
  const seed = individualNet(S, ['fri', 'sat']).map((p, i) => `<tr><td class="pos">${p.rounds === 2 ? i + 1 : '–'}</td><td>${esc(p.name)}</td><td class="num">${p.index.toFixed(1)}</td><td class="num">${p.detail.fri ?? '<span class="muted">–</span>'}</td><td class="num">${p.detail.sat ?? '<span class="muted">–</span>'}</td><td class="num score">${p.rounds === 2 ? p.total : ''}</td></tr>`).join('');
  const paid = tm.list.reduce((s, p) => s + p.total, 0), pot = buyIn * tm.list.length;
  return `<section class="panel"><div class="row between"><h2>Trip Money List</h2><div class="kpis"><div class="kpi"><div class="v">${fmt$(pot)}</div><div class="l">Pot</div></div><div class="kpi"><div class="v">${fmt$(paid)}</div><div class="l">Paid so far</div></div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Player</th><th class="num">Fri</th><th class="num">Sat</th><th class="num">Sun</th><th class="num">Weekend</th><th class="num">Won</th><th class="num">Net vs ${fmt$(buyIn)}</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  ${weekendPanel(tm.weekend)}
  <section class="panel"><div><h3>Individual net, Friday + Saturday</h3><div class="muted small">Each player's own net score (gross minus course handicap) for both rounds. This ranking seeds Sunday's scramble: #1 plays with last place, #2 with second-to-last, and so on.</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Rank</th><th>Player</th><th class="num">Index</th><th class="num">Fri net</th><th class="num">Sat net</th><th class="num">Total</th></tr></thead><tbody>${seed}</tbody></table></div></section>`;
}

// ---- score entry ----
function teamsFor(day) { return (S.teams[day] || []).filter(t => t.pids && t.pids.some(p => p && S.players[p])); }
function draftKey(day, key) { return day + '|' + key; }
function cardValues(day, key) {
  const d = ui.drafts[draftKey(day, key)];
  if (d) return d;
  const c = S.scores[day] && S.scores[day][key];
  return Array.isArray(c) ? c.map(v => v == null ? '' : String(v)) : new Array(18).fill('');
}
function markClass(v, par) {
  const n = Number(v); if (v === '' || isNaN(n)) return '';
  const d = n - par; return d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 1 ? 'bogey' : d >= 2 ? 'dbl' : '';
}
function viewScores() {
  const day = ui.sday, dc = S.config.days[day], fmt = FORMATS[dc.format], course = S.config.courses[dc.course];
  const teams = teamsFor(day);
  const r = computeDay(S, day);
  const byId = Object.fromEntries(r.standings.map(t => [t.id, t]));
  if (!teams.find(t => t.id === ui.team)) ui.team = teams[0] ? teams[0].id : null;
  const list = teams.map((t, i) => { const st = byId[t.id]; const thru = st ? st.thru : 0;
    const dirty = (fmt.scramble ? [t.id] : t.pids).some(k => ui.drafts[draftKey(day, k)]);
    return `<button class="teambtn" aria-pressed="${t.id === ui.team}" data-act="pick-team" data-id="${esc(t.id)}"><span class="t"><b>TEAM ${i + 1}</b>${esc(t.pids.filter(p => S.players[p]).map(p => S.players[p].name).join(' / '))}</span><span class="thru ${thru === 18 ? 'done' : ''}">${dirty ? 'Unsaved' : thru === 18 ? '✓ 18' : thru ? 'Thru ' + thru : '—'}</span></button>`; }).join('');
  let editor = '';
  const team = teams.find(t => t.id === ui.team);
  if (team) {
    const H = [...Array(18).keys()];
    const head = `<tr><th>Hole</th>${H.slice(0, 9).map(h => `<th>${h + 1}</th>`).join('')}<th class="tot">Out</th>${H.slice(9).map(h => `<th>${h + 1}</th>`).join('')}<th class="tot">In</th><th class="tot">Tot</th></tr>`;
    const meta = (label, arr, total) => `<tr class="meta"><td>${label}</td>${H.slice(0, 9).map(h => `<td>${arr[h]}</td>`).join('')}<td class="tot">${total ? arr.slice(0, 9).reduce((a, b) => a + b, 0) : ''}</td>${H.slice(9).map(h => `<td>${arr[h]}</td>`).join('')}<td class="tot">${total ? arr.slice(9).reduce((a, b) => a + b, 0) : ''}</td><td class="tot">${total ? arr.reduce((a, b) => a + b, 0) : ''}</td></tr>`;
    const rowFor = (key, label, sub, ph) => {
      const vals = cardValues(day, key);
      const tot = (a) => a.reduce((s, v) => s + (Number(v) || 0), 0) || '';
      const cell = (h) => { const p = pops(ph, course.si[h]); return `<td><span class="cell"><input id="sc-${esc(key)}-${h}" data-score="${esc(key)}" data-h="${h}" class="${markClass(vals[h], course.pars[h])}" inputmode="numeric" maxlength="2" value="${esc(vals[h])}" aria-label="${esc(label)} hole ${h + 1}" ${canWrite && mode === 'live' ? '' : 'disabled'}>${p > 0 ? `<span class="pop">${'●'.repeat(p)}</span>` : p < 0 ? '<span class="pop">+</span>' : ''}</span></td>`; };
      return `<tr><td><span class="pname">${esc(label)}</span><span class="pmeta">${sub}</span></td>${H.slice(0, 9).map(cell).join('')}<td class="tot">${tot(vals.slice(0, 9))}</td>${H.slice(9).map(cell).join('')}<td class="tot">${tot(vals.slice(9))}</td><td class="tot">${tot(vals)}</td></tr>`;
    };
    let body = '';
    if (fmt.scramble) {
      const ph = scrambleTeamHcp(S, team.pids, day);
      body = rowFor(team.id, 'Team score', `${team.pids.map(p => esc(S.players[p].name.split(' ')[0])).join(' & ')} · team hcp ${ph}`, ph);
    } else {
      body = team.pids.map(pid => {
        const ph = computeDayPH(pid, day);
        const tee = teeName(pid, day);
        return rowFor(pid, S.players[pid].name, `Idx ${Number(S.players[pid].index).toFixed(1)} · CH ${ph} · ${esc(tee)}`, ph);
      }).join('');
      const st = byId[team.id];
      if (st) body += `<tr class="team"><td>${fmt.balls > 1 ? '2 best nets' : 'Best net'}</td>${H.slice(0, 9).map(h => `<td>${st.holes[h] ?? ''}</td>`).join('')}<td class="tot"></td>${H.slice(9).map(h => `<td>${st.holes[h] ?? ''}</td>`).join('')}<td class="tot"></td><td class="tot">${st.thru === 18 ? st.total : ''}</td></tr>`;
    }
    const keys = fmt.scramble ? [team.id] : team.pids;
    const dirty = keys.some(k => ui.drafts[draftKey(day, k)]);
    editor = `<section class="panel"><div class="row between"><h3>Team ${teams.indexOf(team) + 1} card</h3>
      <div class="row">${dirty ? '<span class="pill live">Unsaved changes</span><button class="btn" data-act="discard">Discard</button>' : ''}<button class="btn primary" data-act="save-card" ${dis()} ${dirty ? '' : 'disabled'}>Save card</button></div></div>
      <div class="tbl-wrap"><table class="card"><thead>${head}</thead><tbody>${meta('Par', course.pars, true)}${meta('Hdcp', course.si, false)}${body}</tbody></table></div>
      <div class="muted small">Enter gross scores. Dots mark holes where a player gets a stroke. Circles are birdies, squares are bogeys. The best net row updates after you save.</div></section>`;
  }
  const opts = (sel) => `<option value="">— not entered —</option>` + Object.entries(S.players).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([pid, p]) => `<option value="${pid}" ${pid === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const contests = (dc.contests || []).map(c => `<label class="f">${c.type === 'LD' ? 'Long drive' : 'Closest to pin'} · #${c.hole} · ${fmt$(c.amt)}<select id="ex-${day}-${c.id}" data-extra="${c.id}" ${dis()}>${opts(S.extras[day] && S.extras[day][c.id])}</select></label>`).join('');
  const clearBox = (mode === 'live' && canWrite) ? (ui.clearing
    ? `<section class="banner" role="alertdialog" aria-labelledby="clr-h"><p id="clr-h"><b>Are you sure?</b> This erases every score entered for Friday, Saturday and Sunday${ui.clearExtras ? ', plus all closest-to-pin and long-drive winners' : ''}. Players, teams and payouts stay. This can't be undone.</p>
        <div class="row"><label class="row small"><input type="checkbox" id="clr-extras" data-clrx="1" ${ui.clearExtras ? 'checked' : ''}> Also clear contest winners</label><button class="btn" data-act="clear-cancel">Cancel</button><button class="btn danger armed" data-act="clear-yes">Yes, clear all scores</button></div></section>`
    : ui.filling
    ? `<section class="banner" role="alertdialog" aria-labelledby="fill-h"><p id="fill-h"><b>Are you sure?</b> This replaces every Friday and Saturday score with made-up test scores, picks random closest-to-pin and long-drive winners, and clears Sunday's teams and scores so you can re-pair them.</p>
        <div class="row"><button class="btn" data-act="fill-cancel">Cancel</button><button class="btn primary" data-act="fill-yes">Yes, fill test scores</button></div></section>`
    : `<div class="row" style="justify-content:flex-end"><button class="btn" data-act="fill-ask">Fill test scores (Fri + Sat)</button><button class="btn danger" data-act="clear-ask">Clear scores</button></div>`) : '';
  return dayChips(day, 'sday') + clearBox + `
  <section class="panel"><div class="row between"><h2>${DAY_LABEL[day]} cards · ${esc(course.name)}</h2><span class="muted small">${esc(fmt.label)}</span></div>
    ${teams.length ? `<div class="teamlist">${list}</div>` : `<div class="empty">No ${DAY_LABEL[day]} teams yet. Set them under Players &amp; Teams.</div>`}</section>
  ${editor}
  <section class="panel"><h3>${DAY_LABEL[day]} contest winners</h3>${contests ? `<div class="grid2" style="gap:12px">${contests}</div>` : '<div class="muted">No contests set for this day.</div>'}</section>`;
}
function computeDayPH(pid, day) { const t = teeObj(pid, day); return Math.round(courseHcp(Number(S.players[pid].index) || 0, t) * (S.config.days[day].allowance ?? 100) / 100); }
function teeObj(pid, day) { const c = S.config.courses[S.config.days[day].course]; const want = S.players[pid].tees && S.players[pid].tees[day]; return c.tees.find(t => t.id === want) || c.tees.find(t => t.id === c.defaultTee) || c.tees[0]; }
function teeName(pid, day) { return teeObj(pid, day).name; }

// ---- players & teams ----
function viewPlayers() {
  const c = S.config;
  const ids = Object.keys(S.players).sort((a, b) => S.players[a].name.localeCompare(S.players[b].name));
  const teeSel = (pid, day) => { const course = c.courses[c.days[day].course]; const cur = (S.players[pid].tees && S.players[pid].tees[day]) || course.defaultTee;
    return `<select id="tee-${pid}-${day}" data-tee="${pid}" data-day="${day}" ${dis()}>${course.tees.map(t => `<option value="${t.id}" ${t.id === cur ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>`; };
  const rows = ids.map(pid => { const p = S.players[pid];
    return `<tr><td><input id="pn-${pid}" data-pfield="name" data-pid="${pid}" value="${esc(p.name)}" ${dis()} style="width:150px"></td>
      <td><input id="pi-${pid}" data-pfield="index" data-pid="${pid}" value="${esc(p.index)}" inputmode="decimal" ${dis()} style="width:64px"></td>
      ${DAYS.map(d => `<td>${teeSel(pid, d)}<span class="muted small"> CH ${computeDayPH(pid, d)}</span></td>`).join('')}
      <td>${canWrite && mode === 'live' ? `<button class="link" data-act="del-player" data-pid="${pid}">${ui.armed === 'del-' + pid ? 'Tap to confirm' : 'Remove'}</button>` : ''}</td></tr>`; }).join('');
  const teamSection = (day) => {
    const dc = c.days[day], size = FORMATS[dc.format].size;
    const cur = S.teams[day] || [];
    let lastUsed = -1; cur.forEach((t, i) => { if ((t.pids || []).some(p => p && S.players[p])) lastUsed = i; });
    const n = Math.max(Math.ceil(ids.length / size), lastUsed + 1);
    const used = {}; cur.forEach(t => (t.pids || []).forEach(p => { if (p) used[p] = (used[p] || 0) + 1; }));
    const unassigned = ids.filter(p => !used[p]);
    const cards = [...Array(n).keys()].map(i => { const t = cur[i] || { pids: [] };
      return `<div class="teamcard"><b>TEAM ${i + 1}</b>${[...Array(size).keys()].map(j => { const v = t.pids[j] || '';
        return `<select id="tm-${day}-${i}-${j}" data-team="${day}" data-ti="${i}" data-tj="${j}" class="${v && used[v] > 1 ? 'dup' : ''}" ${dis()}><option value="">— open —</option>${ids.map(p => `<option value="${p}" ${p === v ? 'selected' : ''}>${esc(S.players[p].name)}</option>`).join('')}</select>`; }).join('')}</div>`; }).join('');
    const tools = day === 'sat' ? `<button class="btn" data-act="draw-sat" ${dis()}>Random draw</button>`
      : day === 'sun' ? `<button class="btn" data-act="pair-sun" ${dis()}>${ui.armed === 'pair-sun' ? 'Tap again: this clears Sunday scores' : 'Pair from Fri + Sat net'}</button>` : '';
    const note = day === 'fri' ? 'Players pick their own partners.' : day === 'sat' ? 'Random draw into teams of 4. Redraw as many times as you like before play.' : 'Pairs #1 with #' + ids.length + ', #2 with #' + (ids.length - 1) + ', and so on, by individual net score over Friday and Saturday. Run it after Saturday\'s cards are in.';
    return `<section class="panel"><div class="row between"><div><h3>${DAY_LABEL[day]} teams · ${esc(FORMATS[dc.format].label)}</h3><div class="muted small">${note}${unassigned.length ? ` <b class="bad">${unassigned.length} unassigned:</b> ${unassigned.map(p => esc(S.players[p].name)).join(', ')}` : ''}</div></div><div class="row">${tools}</div></div><div class="teamcards">${cards}</div></section>`;
  };
  return `<section class="panel"><div class="row between"><h2>Players · ${ids.length}</h2><span class="muted small">CH = course handicap from index, slope, rating and par for the tees played</span></div>
    ${canWrite && mode === 'live' ? `<label class="f">Add players · one per line: Name, Index<textarea id="bulk" placeholder="Player 1, 12.4&#10;Player 2, 8.1"></textarea></label><div class="row"><button class="btn primary" data-act="bulk-add">Add players</button></div>` : ''}
    ${ids.length ? `<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Index</th>${DAYS.map(d => `<th>${DAY_LABEL[d]} tees</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}</section>
  ${DAYS.map(teamSection).join('')}`;
}

// ---- setup ----
function viewSetup() {
  const c = S.config, n = Object.keys(S.players).length, pot = n * (Number(c.buyIn) || 0);
  let allocated = 0;
  const daySection = (day) => {
    const dc = c.days[day];
    const places = dc.places || [];
    const pTot = places.reduce((s, v) => s + (Number(v) || 0), 0), cTot = (dc.contests || []).reduce((s, x) => s + (Number(x.amt) || 0), 0), dTot = pTot + (Number(dc.skinsPot) || 0) + cTot;
    allocated += dTot;
    const course = c.courses[dc.course];
    return `<section class="panel"><div class="row between"><h3>${DAY_LABEL[day]}</h3><span class="money">${fmt$(dTot)}</span></div>
      <div class="row">
        <label class="f">Course<select id="d-${day}-course" data-dfield="course" data-day="${day}" ${dis()}>${Object.entries(c.courses).map(([k, v]) => `<option value="${k}" ${k === dc.course ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
        <label class="f">Format<select id="d-${day}-format" data-dfield="format" data-day="${day}" ${dis()}>${Object.entries(FORMATS).map(([k, v]) => `<option value="${k}" ${k === dc.format ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
        ${FORMATS[dc.format].scramble ? `<label class="f">Team handicap<select id="d-${day}-scrHcp" data-dfield="scrHcp" data-day="${day}" ${dis()}><option value="avg" ${dc.scrHcp !== '3515' ? 'selected' : ''}>Average of course handicaps</option><option value="3515" ${dc.scrHcp === '3515' ? 'selected' : ''}>35% low + 15% high (USGA)</option></select></label>
          ${dc.scrHcp !== '3515' ? `<label class="f">Average × %<input id="d-${day}-scrPct" data-dfield="scrPct" data-day="${day}" data-num="1" value="${dc.scrPct ?? 100}" style="width:80px" ${dis()}></label>` : ''}`
          : `<label class="f">Handicap allowance %<input id="d-${day}-allowance" data-dfield="allowance" data-day="${day}" data-num="1" value="${dc.allowance ?? 100}" style="width:90px" ${dis()}></label>`}
      </div>
      <div><div class="muted small" style="margin-bottom:6px">Team places paid (${places.length}) · ${fmt$(pTot)}, split evenly among teammates</div>
        <div class="placelist">${places.map((v, i) => `<label class="f">${ordinal(i + 1)}<input id="pl-${day}-${i}" data-place="${i}" data-day="${day}" data-num="1" value="${numFmt(v)}" ${dis()}></label>`).join('')}
        ${mode === 'live' && canWrite ? `<button class="btn" data-act="add-place" data-day="${day}">+ Place</button>${places.length ? `<button class="btn" data-act="rm-place" data-day="${day}">− Place</button>` : ''}` : ''}</div></div>
      <div class="row">
        <label class="f">Skins pot<input id="d-${day}-skinsPot" data-dfield="skinsPot" data-day="${day}" data-num="1" value="${numFmt(dc.skinsPot)}" style="width:90px" ${dis()}></label>
        <label class="f">Skins scored<select id="d-${day}-skinsType" data-dfield="skinsType" data-day="${day}" ${dis()}>${Object.entries(SKIN_LABEL).map(([k, v]) => `<option value="${k}" ${(dc.skinsType || 'netGrossP3') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <div><div class="muted small" style="margin-bottom:6px">Closest to pin &amp; long drive · ${fmt$(cTot)}</div>
        <div class="tbl-wrap"><table><thead><tr><th>Contest</th><th>Hole</th><th>Pays</th><th></th></tr></thead><tbody>
        ${(dc.contests || []).map((x, i) => `<tr><td><select id="ct-${day}-${i}-type" data-contest="${i}" data-cfield="type" data-day="${day}" ${dis()}><option value="CTP" ${x.type === 'CTP' ? 'selected' : ''}>Closest to pin</option><option value="LD" ${x.type === 'LD' ? 'selected' : ''}>Long drive</option></select></td>
          <td><select id="ct-${day}-${i}-hole" data-contest="${i}" data-cfield="hole" data-day="${day}" ${dis()}>${course.pars.map((p, h) => `<option value="${h + 1}" ${h + 1 == x.hole ? 'selected' : ''}>#${h + 1} · par ${p}</option>`).join('')}</select></td>
          <td><input id="ct-${day}-${i}-amt" data-contest="${i}" data-cfield="amt" data-day="${day}" data-num="1" value="${numFmt(x.amt)}" style="width:80px" ${dis()}></td>
          <td>${mode === 'live' && canWrite ? `<button class="link" data-act="rm-contest" data-day="${day}" data-i="${i}">Remove</button>` : ''}</td></tr>`).join('')}
        </tbody></table></div>
        ${mode === 'live' && canWrite ? `<div class="row" style="margin-top:8px"><button class="btn" data-act="add-contest" data-day="${day}">+ Contest</button></div>` : ''}</div>
    </section>`;
  };
  const days = DAYS.map(daySection).join('');
  const wk = (c.weekend && c.weekend.places) || [];
  const wTot = wk.reduce((s, v) => s + (Number(v) || 0), 0);
  allocated += wTot;
  const weekendSec = `<section class="panel"><div class="row between"><h3>Weekend individual</h3><span class="money">${fmt$(wTot)}</span></div>
    <div class="muted small">Fri individual net + Sat individual net + Sunday team net. Ties split.</div>
    <div class="placelist">${wk.map((v, i) => `<label class="f">${ordinal(i + 1)}<input id="wk-${i}" data-wplace="${i}" data-num="1" value="${numFmt(v)}" ${dis()}></label>`).join('')}
    ${mode === 'live' && canWrite ? `<button class="btn" data-act="add-wplace">+ Place</button>${wk.length ? '<button class="btn" data-act="rm-wplace">− Place</button>' : ''}` : ''}</div></section>`;
  const left = pot - allocated;
  const courses = Object.entries(c.courses).map(([k, co]) => {
    const H = [...Array(18).keys()];
    return `<section class="panel"><div class="row between"><h3>${esc(co.name)}</h3><span class="muted small">${esc(co.city || '')} · Par ${co.pars.reduce((a, b) => a + b, 0)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Tees</th><th class="num">Rating</th><th class="num">Slope</th><th class="num">Par</th><th>Default</th></tr></thead><tbody>
      ${co.tees.map((t, i) => `<tr><td><input id="te-${k}-${i}-name" data-course="${k}" data-tee-i="${i}" data-tfield="name" value="${esc(t.name)}" ${dis()} style="width:170px"></td>
        <td class="num"><input id="te-${k}-${i}-rating" data-course="${k}" data-tee-i="${i}" data-tfield="rating" data-num="1" value="${t.rating}" style="width:70px" ${dis()}></td>
        <td class="num"><input id="te-${k}-${i}-slope" data-course="${k}" data-tee-i="${i}" data-tfield="slope" data-num="1" value="${t.slope}" style="width:64px" ${dis()}></td>
        <td class="num"><input id="te-${k}-${i}-par" data-course="${k}" data-tee-i="${i}" data-tfield="par" data-num="1" value="${t.par}" style="width:56px" ${dis()}></td>
        <td><input type="radio" name="def-${k}" id="te-${k}-${i}-def" data-course="${k}" data-default="${t.id}" ${t.id === co.defaultTee ? 'checked' : ''} ${dis()} aria-label="Default tee"></td></tr>`).join('')}
      </tbody></table></div>
      ${mode === 'live' && canWrite ? `<div class="row"><button class="btn" data-act="add-tee" data-course="${k}">+ Tee</button></div>` : ''}
      <div class="tbl-wrap"><table class="card"><thead><tr><th>Hole</th>${H.map(h => `<th>${h + 1}</th>`).join('')}</tr></thead><tbody>
        <tr><td>Par</td>${H.map(h => `<td><input class="siinput" id="cp-${k}-${h}" data-course="${k}" data-hole="${h}" data-hfield="pars" data-num="1" value="${co.pars[h]}" ${dis()}></td>`).join('')}</tr>
        <tr><td>Hdcp</td>${H.map(h => `<td><input class="siinput" id="cs-${k}-${h}" data-course="${k}" data-hole="${h}" data-hfield="si" data-num="1" value="${co.si[h]}" ${dis()}></td>`).join('')}</tr>
      </tbody></table></div></section>`;
  }).join('');
  return `<section class="panel"><div class="row between"><h2>The Pot</h2>
      <div class="kpis"><div class="kpi"><div class="v">${n}</div><div class="l">Players</div></div><div class="kpi"><div class="v">${fmt$(pot)}</div><div class="l">Pot</div></div><div class="kpi"><div class="v">${fmt$(allocated)}</div><div class="l">Allocated</div></div><div class="kpi"><div class="v ${Math.abs(left) < 0.01 ? 'ok' : 'bad'}">${left >= 0 ? '' : '−'}${fmt$(Math.abs(left))}</div><div class="l">${left >= 0 ? 'Unallocated' : 'Over the pot'}</div></div></div></div>
    <div class="row">
      <label class="f">Buy-in per player<input id="buyIn" data-gfield="buyIn" data-num="1" value="${numFmt(c.buyIn)}" style="width:100px" ${dis()}></label>
      <label class="f">Ties for a paid place<select id="tieBreak" data-gfield="tieBreak" ${dis()}><option value="split" ${c.tieBreak !== 'cards' ? 'selected' : ''}>Split the money</option><option value="cards" ${c.tieBreak === 'cards' ? 'selected' : ''}>Match cards (back 9, 6, 3, 18th)</option></select></label>
    </div>
    <div class="muted small">Skins: one low score wins the full skin; two tied for low split it (half skin each); three or more tied means no skin and the hole carries to the next. The skins pot is divided by the number of skins won. Course handicap = Index × Slope ÷ 113 + (Rating − Par), rounded.</div></section>
  ${days}
  ${weekendSec}
  <h2 style="margin-top:8px">Courses</h2>
  <div class="muted small">Ratings, slopes and hole handicaps were pulled from public scorecards. Check them against the card at each course before play.</div>
  ${courses}
  ${canWrite ? `<section class="panel"><h3>Backup</h3><div class="muted small">Save a copy of everything to a file, or load one back in.</div>
    <div class="row"><button class="btn" data-act="export">Download backup file</button><label class="btn" for="imp-file2">Import a trip file</label><input type="file" id="imp-file2" accept=".json,application/json" hidden></div></section>` : ''}
  ${mode === 'live' && canWrite ? `<section class="panel"><h3>Reset</h3><div class="muted small">Erases all players, teams, scores and setup for this trip.</div><div class="row"><button class="btn danger ${ui.armed === 'reset' ? 'armed' : ''}" data-act="reset">${ui.armed === 'reset' ? 'Tap again to erase everything' : 'Reset trip'}</button></div></section>` : ''}`;
}

// ---- events ----
function arm(key) { ui.armed = key; clearTimeout(arm.t); arm.t = setTimeout(() => { ui.armed = null; render(); }, 4000); }

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; try { localStorage.setItem('wyd-tab', ui.tab); } catch (x) {}
  render(); try { window.scrollTo(0, 0); } catch (x) {}
});

document.getElementById('main').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, day = b.dataset.day;
  if (act === 'rday') { ui.rday = day; return render(); }
  if (act === 'pin-open') return askPin();
  if (act === 'pin-cancel') { ui.pinOpen = false; return render(); }
  if (act === 'export') return exportTrip();
  if (act === 'imp-cancel') { ui.importData = null; return render(); }
  if (act === 'imp-yes') {
    const d = ui.importData; ui.importData = null; ui.drafts = {};
    for (const id of DOC_IDS) if (d[id]) await writeDoc(id, d[id], false);
    toast('Trip imported.'); return render();
  }
  if (act === 'bday') { ui.bday = day; ui.bview = 'day'; setRotation(); return render(); }
  if (act === 'bweek') { ui.bview = 'weekend'; setRotation(); return render(); }
  if (act === 'bpairs') { ui.bview = 'pairs'; setRotation(); return render(); }
  if (act === 'brot') { ui.rotate = !ui.rotate; setRotation(); return render(); }
  if (act === 'tv-on') { ui.tv = true; render(); try { window.scrollTo(0, 0); } catch (x) {} return; }
  if (act === 'tv-off') { ui.tv = false; try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (x) {} return render(); }
  if (act === 'fs') {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
    catch (x) { toast('Full screen is not available here. Use the browser or TV\'s own full-screen option.'); }
    return;
  }
  if (act === 'sday') { ui.sday = day; ui.team = null; return render(); }
  if (act === 'pick-team') { ui.team = b.dataset.id; return render(); }
  if (act === 'start') { const cfg = defaultConfig(); return writeTrip({ config: cfg, players: {}, teams: { fri: [], sat: [], sun: [] }, scores: { fri: {}, sat: {}, sun: {} }, extras: {} }); }
  if (act === 'load-sample') { toast('Saving the sample trip…'); return writeTrip(makeSample()); }
  if (act === 'fill-ask') { ui.filling = true; ui.clearing = false; return render(); }
  if (act === 'fill-cancel') { ui.filling = false; return render(); }
  if (act === 'fill-yes') {
    ui.filling = false; ui.drafts = {};
    const sc = makeTestScores(S, (Date.now() % 2147483000) + 1);
    const ids = Object.keys(S.players), pick = () => ids[Math.floor(Math.random() * ids.length)];
    const ex = { fri: {}, sat: {}, sun: {} };
    for (const d of ['fri', 'sat']) for (const c of (S.config.days[d].contests || [])) ex[d][c.id] = pick();
    await writeDoc('scores_fri', { h: sc.fri }, false);
    await writeDoc('scores_sat', { h: sc.sat }, false);
    await writeDoc('scores_sun', { h: {} }, false);
    await writeDoc('extras', ex, false);
    await writeDoc('teams', { sun: [] }, true);
    toast('Test scores filled. Pair Sunday under Players & Teams.'); return render();
  }
  if (act === 'clear-ask') { ui.clearing = true; ui.filling = false; ui.clearExtras = true; return render(); }
  if (act === 'clear-cancel') { ui.clearing = false; return render(); }
  if (act === 'clear-yes') {
    ui.clearing = false; ui.drafts = {};
    for (const d of DAYS) await writeDoc('scores_' + d, { h: {} }, false);
    if (ui.clearExtras) await writeDoc('extras', { fri: {}, sat: {}, sun: {} }, false);
    toast(ui.clearExtras ? 'All scores and contest winners cleared.' : 'All scores cleared.'); return render();
  }
  if (act === 'discard') { const team = teamsFor(ui.sday).find(t => t.id === ui.team); const keys = FORMATS[S.config.days[ui.sday].format].scramble ? [team.id] : team.pids; keys.forEach(k => delete ui.drafts[draftKey(ui.sday, k)]); return render(); }
  if (act === 'save-card') {
    const d = ui.sday, h = {};
    Object.keys(ui.drafts).forEach(k => { const [dd, key] = k.split('|'); if (dd === d) h[key] = ui.drafts[k].map(v => v === '' ? null : Number(v)); });
    const bad = Object.values(h).some(a => a.some(v => v != null && (isNaN(v) || v < 1 || v > 15)));
    if (bad) return toast('Scores must be whole numbers from 1 to 15.');
    Object.keys(ui.drafts).forEach(k => { if (k.startsWith(d + '|')) delete ui.drafts[k]; });
    await writeDoc('scores_' + d, { h }, true); toast('Card saved.'); return render();
  }
  if (act === 'bulk-add') {
    const lines = ($('#bulk').value || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
    const list = {}; let bad = 0;
    for (const l of lines) { const m = l.match(/^(.*?)[,\t ]+(\+?-?\d+(?:\.\d+)?)\s*$/); if (!m) { bad++; continue; }
      let idx = m[2].startsWith('+') ? -Number(m[2].slice(1)) : Number(m[2]); list[uid('p')] = { name: m[1].trim().replace(/,$/, ''), index: idx }; }
    if (!Object.keys(list).length) return toast('Use one player per line, like: Player 1, 12.4');
    $('#bulk').value = '';
    await writeDoc('players', { list }, true);
    return toast(`Added ${Object.keys(list).length} player${Object.keys(list).length > 1 ? 's' : ''}${bad ? `. Skipped ${bad} line${bad > 1 ? 's' : ''} without an index.` : '.'}`);
  }
  if (act === 'del-player') { const pid = b.dataset.pid; if (ui.armed !== 'del-' + pid) { arm('del-' + pid); return render(); } ui.armed = null; return writeDoc('players', { list: { [pid]: null } }, true); }
  if (act === 'draw-sat') {
    const ids = Object.keys(S.players); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const size = FORMATS[S.config.days.sat.format].size, teams = [];
    for (let i = 0; i < ids.length; i += size) teams.push({ id: 'A' + (teams.length + 1), pids: ids.slice(i, i + size) });
    return writeDoc('teams', { sat: teams }, true);
  }
  if (act === 'pair-sun') {
    const hasScores = Object.keys(S.scores.sun || {}).length > 0;
    if (hasScores && ui.armed !== 'pair-sun') { arm('pair-sun'); return render(); }
    ui.armed = null;
    const { teams, ranked } = sundayPairs(S);
    if (ranked.some(r => r.rounds < 2)) toast('Some players are missing a Friday or Saturday card, so they rank last.');
    await writeDoc('teams', { sun: teams }, true);
    if (hasScores) await writeDoc('scores_sun', { h: {} }, false);
    return;
  }
  const cfg = clone(S.config);
  if (act === 'add-wplace') { cfg.weekend = cfg.weekend || { places: [] }; cfg.weekend.places.push(0); return saveConfig(cfg); }
  if (act === 'rm-wplace') { cfg.weekend.places.pop(); return saveConfig(cfg); }
  if (act === 'add-place') { cfg.days[day].places.push(0); return saveConfig(cfg); }
  if (act === 'rm-place') { cfg.days[day].places.pop(); return saveConfig(cfg); }
  if (act === 'add-contest') { (cfg.days[day].contests = cfg.days[day].contests || []).push({ id: uid('c'), type: 'CTP', hole: 1, amt: 0 }); return saveConfig(cfg); }
  if (act === 'rm-contest') { cfg.days[day].contests.splice(Number(b.dataset.i), 1); return saveConfig(cfg); }
  if (act === 'add-tee') { cfg.courses[b.dataset.course].tees.push({ id: uid('t'), name: 'New tee', rating: 72, slope: 113, par: cfg.courses[b.dataset.course].pars.reduce((a, x) => a + x, 0) }); return saveConfig(cfg); }
  if (act === 'reset') { if (ui.armed !== 'reset') { arm('reset'); return render(); } ui.armed = null; ui.drafts = {}; return deleteAll(); }
});

// score typing: keep a draft, auto-advance
document.getElementById('main').addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset.score) return;
  const key = el.dataset.score, h = Number(el.dataset.h), dk = draftKey(ui.sday, key);
  el.value = el.value.replace(/[^0-9]/g, '');
  const vals = ui.drafts[dk] || cardValues(ui.sday, key).slice();
  vals[h] = el.value; ui.drafts[dk] = vals;
  const course = S.config.courses[S.config.days[ui.sday].course];
  el.className = markClass(el.value, course.pars[h]);
  const saveBtn = $('[data-act="save-card"]'); if (saveBtn) saveBtn.disabled = false;
  if (el.value.length === 2 || (el.value.length === 1 && el.value !== '1')) {
    const next = document.getElementById(`sc-${key}-${h + 1}`); if (next) { next.focus(); next.select(); }
  }
});
document.getElementById('main').addEventListener('focusin', (e) => { if (e.target.dataset && e.target.dataset.score) e.target.select(); });
document.getElementById('main').addEventListener('focusout', (e) => { if (e.target.dataset && e.target.dataset.score && !$('#main').contains(e.relatedTarget)) render(); });

document.getElementById('main').addEventListener('submit', (e) => {
  if (e.target.dataset.form === 'pin') { e.preventDefault(); submitPin(); }
});

document.getElementById('main').addEventListener('change', async (e) => {
  const el = e.target, ds = el.dataset;
  if (el.id === 'imp-file' || el.id === 'imp-file2') {
    const f = el.files && el.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !d.config || !d.config.cfg || !d.players) throw new Error('bad');
      ui.importData = d; ui.importName = f.name; render(); window.scrollTo(0, 0);
    } catch (x) { toast("That file isn't a Who's Your Daddy trip file."); }
    el.value = ''; return;
  }
  if (ds.score) return render();
  if (ds.brot) { ui.rotate = el.checked; setRotation(); return; }
  if (ds.clrx) { ui.clearExtras = el.checked; return render(); }
  const num = (v) => { const n = Number(String(v).replace(/[$,]/g, '')); return isNaN(n) ? 0 : n; };
  const val = ds.num ? num(el.value) : el.value;
  if (ds.pfield) { let v = val; if (ds.pfield === 'index') { const s = String(el.value).trim(); v = s.startsWith('+') ? -num(s.slice(1)) : num(s); } else if (!String(v).trim()) return render(); return writeDoc('players', { list: { [ds.pid]: { [ds.pfield]: v } } }, true); }
  if (ds.tee) return writeDoc('players', { list: { [ds.tee]: { tees: { [ds.day]: el.value } } } }, true);
  if (ds.team) {
    const day = ds.team, size = FORMATS[S.config.days[day].format].size;
    const teams = clone(S.teams[day] || []); const i = Number(ds.ti), j = Number(ds.tj);
    while (teams.length <= i) teams.push({ id: (day === 'fri' ? 'F' : day === 'sat' ? 'A' : 'S') + (teams.length + 1), pids: [] });
    teams.forEach((t, k) => { if (!t.id) t.id = (day === 'fri' ? 'F' : day === 'sat' ? 'A' : 'S') + (k + 1); t.pids = [...Array(size).keys()].map(x => t.pids[x] || null); });
    teams[i].pids[j] = el.value || null;
    return writeDoc('teams', { [day]: teams }, true);
  }
  if (ds.extra) return writeDoc('extras', { [ui.sday]: { [ds.extra]: el.value || null } }, true);
  const cfg = clone(S.config);
  if (ds.gfield) cfg[ds.gfield] = val;
  else if (ds.dfield) { cfg.days[ds.day][ds.dfield] = val; }
  else if (ds.place != null) cfg.days[ds.day].places[Number(ds.place)] = val;
  else if (ds.wplace != null) { cfg.weekend = cfg.weekend || { places: [] }; cfg.weekend.places[Number(ds.wplace)] = val; }
  else if (ds.contest != null) { const c = cfg.days[ds.day].contests[Number(ds.contest)]; c[ds.cfield] = ds.cfield === 'hole' ? Number(el.value) : val; if (ds.cfield !== 'amt') c.id = c.id || uid('c'); }
  else if (ds.tfield) cfg.courses[ds.course].tees[Number(ds.teeI)][ds.tfield] = val;
  else if (ds.default) cfg.courses[ds.course].defaultTee = ds.default;
  else if (ds.hfield) cfg.courses[ds.course][ds.hfield][Number(ds.hole)] = val;
  else return;
  return saveConfig(cfg);
});

async function boot() {
  const fallback = () => {
    backend = 'local'; canWrite = true;
    try { docs = JSON.parse(localStorage.getItem('bgt-docs') || '{}') || {}; } catch (e) { docs = {}; }
    deriveState(); render();
    toast("Couldn't reach the live scoreboard. Working offline on this device.");
  };
  if (!window.firebase) return fallback();
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    db.settings({ ignoreUndefinedProperties: true });
  } catch (e) { return fallback(); }
  backend = 'db';
  db.collection('trip').onSnapshot((snap) => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); });
    docs = next; deriveState(); render();
  }, () => toast('Live updates stopped. Reload the page to reconnect.'));
  try {
    const cred = await firebase.auth().signInAnonymously();
    authId = cred.user.uid;
    const me = await db.collection('editors').doc(authId).get();
    canWrite = me.exists; render();
  } catch (e) { /* watching only */ }
}
setRotation();
boot();
