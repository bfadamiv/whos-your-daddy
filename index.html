<style>
/* Layout: scoreboard band header + tabbed working surface; tables scroll inside their own frames. */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1410; --surface: #151f19; --surface-2: #1a261f; --ink: #e3ebe4; --muted: #8fa195; --line: #2a3a30;
  --band: #10301f; --band-ink: #eef4ef; --band-muted: #8fb39c;
  --pine: #5cbf86; --pine-ink: #0c1a12; --pine-soft: #1c3426;
  --red: #ff7b6b; --gold: #e2b55a; --gold-bg: #2b2413; --warn: #f0b052; --warn-bg: #2d2412; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1410; --surface: #151f19; --surface-2: #1a261f; --ink: #e3ebe4; --muted: #8fa195; --line: #2a3a30;
  --band: #10301f; --band-ink: #eef4ef; --band-muted: #8fb39c;
  --pine: #5cbf86; --pine-ink: #0c1a12; --pine-soft: #1c3426;
  --red: #ff7b6b; --gold: #e2b55a; --gold-bg: #2b2413; --warn: #f0b052; --warn-bg: #2d2412; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.band .wrap { padding-block: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand .sub { color: var(--band-muted); font-size: 13px; margin-top: 4px; }
.status { font-family: var(--font-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 3px; border: 1px solid var(--band-muted); color: var(--band-ink); white-space: nowrap; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.pill.final { background: var(--pine); color: var(--pine-ink); }
.pill.live { background: var(--warn-bg); color: var(--warn); }
.banner { border: 1px solid var(--line); background: var(--gold-bg); border-radius: 6px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner p { margin: 0; max-width: 62ch; }

button.btn, a.btn { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }

.pos { font-family: var(--font-display); font-weight: 700; font-size: 20px; width: 48px; }
.score { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.under { color: var(--red); }
.money { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--gold); }
.money.zero { color: var(--muted); font-weight: 500; }
tr.paid td { background: color-mix(in srgb, var(--gold-bg) 55%, transparent); }
.each { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-body); font-weight: 400; }

.sortbtn { background: none; border: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.sortbtn.on { color: var(--ink); }
.pscores th.grp { text-align: center; border-left: 1px solid var(--line); }
.pscores td:nth-child(4), .pscores td:nth-child(6), .pscores td:nth-child(8), .pscores td:nth-child(10), .pscores td:nth-child(11) { border-left: 1px solid var(--line); }
/* Mode chooser + Keep Score */
.hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.modesw { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--band-ink); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 2px 0; }

.welcome-btn { text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font: inherit; }
.welcome-btn b { font-family: var(--font-display); font-size: 24px; letter-spacing: .03em; text-transform: uppercase; }
.welcome-btn.primary { background: var(--pine); border-color: var(--pine); color: var(--pine-ink); }
.kp-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }

.kp-btn { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 30px; line-height: 1; cursor: pointer; touch-action: manipulation; }

/* Scorecard grid */
.card { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }

.cell { position: relative; display: inline-block; }

/* ===== Clubhouse scoreboard — modeled on a major-championship hand-operated leaderboard.
   Deliberately one look in both themes: green frame, white slats, red under par, green over. */
:root {
  --m-frame: #0e4a2b; --m-frame-2: #145c37; --m-slat: #fdfcf6; --m-ink: #171717; --m-rule: #d8d4c3;
  --m-under: #c3122f; --m-over: #146a3c; --m-gold: #e9c869; --m-flash: #fff1a8; --m-dim: #6f7a70;
  --font-board: 'Playfair Display', Georgia, 'Times New Roman', serif;
}
.bd { container-type: inline-size; background: var(--m-frame); color: #fff; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 4px var(--m-frame-2); }
.bd-ctl { display: flex; flex-direction: column; gap: 10px; }
.bd-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--m-gold); padding-bottom: 10px; }
.bd-kicker { font-family: var(--font-display); letter-spacing: .28em; text-transform: uppercase; font-size: .78em; color: var(--m-gold); }
.bd-name { font-family: var(--font-board); font-style: italic; font-weight: 800; font-size: 2.6em; line-height: 1; color: #fff; text-wrap: balance; }
.bd-sub { font-family: var(--font-display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: .95em; color: #d5e6da; margin-top: 4px; }
.bd-live { font-family: var(--font-display); font-weight: 700; font-size: 1.3em; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.bd-live small { display: block; width: 100%; text-align: right; font-weight: 500; font-size: .62em; letter-spacing: .08em; color: #cfe0d4; }
.bd-dot { width: .6em; height: .6em; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 0 0 rgba(255,77,77,.6); animation: bdpulse 1.6s infinite; }
.bd-dot.done { background: var(--m-gold); animation: none; }
@keyframes bdpulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,77,.55); } 70% { box-shadow: 0 0 0 .55em rgba(255,77,77,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); } }
.bd-main { display: grid; grid-template-columns: minmax(0, 1fr) 19em; gap: 14px; align-items: start; }
.bd-main.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.bd-board { --cols: 3.9em minmax(9em, 1fr) repeat(18, var(--hw, 2.4em)) 3.2em 4.4em; display: flex; flex-direction: column; gap: 3px; background: var(--m-frame-2); padding: 3px; border-radius: 3px; min-width: 0; font-variant-numeric: tabular-nums; }
.bd-board.has-pay { --cols: 3.9em minmax(9em, 1fr) repeat(18, var(--hw, 2.4em)) 3.2em 4.4em 4.6em; }
.bd-board.wk { --cols: 3.9em minmax(0, 1fr) 4.4em 5em; }
.bd-board.ml { --cols: 3.9em minmax(0, 1fr) 5.2em; }
.bd-main.one { grid-template-columns: minmax(0, 34em); justify-content: center; }
.bd-li.s { grid-template-columns: minmax(0, 1fr) auto; }
.bd-li span.wrap { white-space: normal; line-height: 1.25; }

<script>
// ===== Scoring engine (pure functions) =====
const DAYS = ['fri', 'sat', 'sun'];
const FORMATS = {
  bb2:   { label: '2-Man Best Ball (Net)', size: 2, balls: 1, scramble: false },
  bb4x2: { label: '4-Man, 2 Best Balls (Net)', size: 4, balls: 2, scramble: false },
  scr2:  { label: '2-Man Scramble (Net)', size: 2, balls: 1, scramble: true },
};

function sum(a) { return a.reduce((s, v) => s + (v || 0), 0); }
function round2(n) { return Math.round(n * 100) / 100; }

function teeFor(state, pid, day) {
  const dc = state.config.days[day];
  const course = state.config.courses[dc.course];
  const p = state.players[pid];
  const want = p && p.tees && p.tees[day];
  return course.tees.find(t => t.id === want) || course.tees.find(t => t.id === course.defaultTee) || course.tees[0];
}

// WHS: Course Handicap = Index x Slope/113 + (Rating - Par), rounded; then allowance.
function courseHcp(index, tee) {
  return Math.round(index * tee.slope / 113 + (tee.rating - tee.par));
}
function playingHcp(index, tee, allowance) {
  const ch = courseHcp(index, tee);
  return Math.round(ch * (allowance == null ? 100 : allowance) / 100);
}

// Strokes received on a hole of stroke index `si` for playing handicap `ph`.
function pops(ph, si) {
  ph = Math.round(ph);
  if (ph >= 0) return Math.floor(ph / 18) + (si <= ph % 18 ? 1 : 0);
  const p = -ph;
  return -(Math.floor(p / 18) + (si > 18 - (p % 18) ? 1 : 0));
}

// Course handicap for a player on a day: a typed-in override wins, otherwise the WHS formula.
function playerCH(state, pid, day) {
  const p = state.players[pid];
  if (!p) return 0;
  const o = p.ch && p.ch[day];
  if (o != null && o !== '' && !isNaN(Number(o))) return Number(o);
  return courseHcp(Number(p.index) || 0, teeFor(state, pid, day));
}
function playerPH(state, pid, day) {
  const p = state.players[pid];
  if (!p) return 0;
  const a = state.config.days[day].allowance;
  return Math.round(playerCH(state, pid, day) * (a == null ? 100 : a) / 100);
}

// Scramble team handicap. A team's own typed-in handicap wins. '3515d' keeps the decimal (e.g. 4.35).
function scrambleTeamHcp(state, pids, day, team) {
  const dc = state.config.days[day];
  if (team && team.hcp != null && team.hcp !== '' && !isNaN(Number(team.hcp))) return Number(team.hcp);
  const chs = pids.map(pid => state.players[pid] ? playerCH(state, pid, day) : 0).sort((a, b) => a - b);
  if (!chs.length) return 0;
  if ((dc.scrHcp === '3515' || dc.scrHcp === '3515d') && chs.length >= 2) {
    const v = chs[0] * 0.35 + chs[chs.length - 1] * 0.15;
    return dc.scrHcp === '3515d' ? round2(v) : Math.round(v);
  }
  const pct = dc.scrPct == null ? 100 : dc.scrPct;
  return Math.round(sum(chs) / chs.length * pct / 100);
}

// ---- Max score per hole. Trip setting with optional per-day override.
// Types: none, netDoublePar (2×par + strokes), netDoubleBogey (par + 2 + strokes), doublePar, tripleBogey, fixed.
const MAX_RULES = {
  none: 'No max',
  netDoublePar: 'Net double par',
  netDoubleBogey: 'Net double bogey',
  doublePar: 'Double par',
  tripleBogey: 'Triple bogey',
  fixed: 'A set number',
};
function maxRule(state, day) {
  const dc = state.config.days[day] || {};
  const r = dc.maxScore && dc.maxScore.type && dc.maxScore.type !== 'trip' ? dc.maxScore : (state.config.maxScore || { type: 'netDoublePar' });
  return r;
}
function maxFor(state, day, ph, h) {
  const r = maxRule(state, day), course = state.config.courses[state.config.days[day].course];
  const par = course.pars[h], st = pops(ph || 0, course.si[h]);
  switch (r.type) {
    case 'netDoublePar': return 2 * par + st;
    case 'netDoubleBogey': return par + 2 + st;
    case 'doublePar': return 2 * par;
    case 'tripleBogey': return par + 3;
    case 'fixed': return Number(r.value) > 0 ? Number(r.value) : 99;
    default: return 99;
  }
}
function cappedCard(state, day, key, ph) {
  return cardOf(state, day, key).map((g, h) => g == null ? null : Math.min(g, maxFor(state, day, ph, h)));
}

function cardOf(state, day, key) {
  const c = state.scores[day] && state.scores[day][key];
  return Array.isArray(c) ? c.map(v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v)) : new Array(18).fill(null);
}

function teamLabel(state, team) {
  return team.pids.map(pid => (state.players[pid] ? state.players[pid].name : '?')).join(' / ');
}

// Compare two hole-score arrays by matching cards: back 9, back 6, back 3, 18th.
function cardOff(a, b) {
  for (const n of [9, 6, 3, 1]) {
    const d = sum(a.slice(18 - n)) - sum(b.slice(18 - n));
    if (d !== 0) return d;
  }
  return 0;
}

function placeMoney(sorted, places, tieBreak, key) {
  // sorted: complete teams sorted by total (then card-off if chosen). Assign pos + money.
  let i = 0;
  while (i < sorted.length) {
    let j = i + 1;
    while (j < sorted.length && sorted[j].total === sorted[i].total &&
      (tieBreak !== 'cards' || cardOff(sorted[j][key], sorted[i][key]) === 0)) j++;
    let pot = 0;
    for (let k = i; k < j; k++) pot += Number(places[k]) || 0;
    for (let k = i; k < j; k++) {
      sorted[k].pos = i + 1;
      sorted[k].tied = j - i > 1;
      sorted[k].payout = round2(pot / (j - i));
    }
    i = j;
  }
}

function computeDay(state, day) {
  const dc = state.config.days[day];
  const fmt = FORMATS[dc.format] || FORMATS.bb2;
  const course = state.config.courses[dc.course];
  const pars = course.pars, si = course.si;
  const coursePar = sum(pars);
  const teams = ((state.teams && state.teams[day]) || []).filter(t => t.pids && t.pids.some(Boolean))
    .map(t => ({ ...t, pids: t.pids.filter(pid => pid && state.players[pid]) }))
    .filter(t => t.pids.length);
  const money = {};
  const add = (pid, amt, why) => {
    if (!amt) return;
    (money[pid] = money[pid] || { total: 0, items: [] });
    const a = Math.round(amt + 1e-9); // payouts are whole dollars
    money[pid].total = round2(money[pid].total + a);
    money[pid].items.push({ why, amt: a });
  };

  // Units for skins: individuals (best ball days) or teams (scramble).
  const units = [];
  const rows = teams.map(t => {
    const row = { id: t.id, pids: t.pids, name: teamLabel(state, t), holes: new Array(18).fill(null), members: [] };
    if (fmt.scramble) {
      const ph = scrambleTeamHcp(state, t.pids, day, t);
      const gross = cappedCard(state, day, t.id, ph);
      const net = gross.map((g, h) => g == null ? null : g - pops(ph, si[h]));
      row.ph = ph;
      row.gross = gross;
      row.holes = gross.slice();
      row.thru = gross.filter(v => v != null).length;
      row.grossTotal = sum(gross);
      row.total = row.thru === 18 ? round2(row.grossTotal - ph) : null;
      row.toPar = row.total == null ? null : round2(row.total - coursePar);
      units.push({ key: t.id, pids: t.pids, name: row.name, gross, net });
    } else {
      row.members = t.pids.map(pid => {
        const ph = playerPH(state, pid, day);
        const gross = cappedCard(state, day, pid, ph);
        const net = gross.map((g, h) => g == null ? null : g - pops(ph, si[h]));
        units.push({ key: pid, pids: [pid], name: state.players[pid].name, gross, net });
        return { pid, ph, gross, net };
      });
      for (let h = 0; h < 18; h++) {
        const nets = row.members.map(m => m.net[h]);
        if (nets.some(v => v == null)) continue;
        nets.sort((a, b) => a - b);
        row.holes[h] = sum(nets.slice(0, fmt.balls));
      }
      row.thru = row.holes.filter(v => v != null).length;
      row.total = row.thru === 18 ? sum(row.holes) : null;
      row.toPar = row.total == null ? null : row.total - coursePar * fmt.balls;
      row.running = sum(row.holes);
      row.runningPar = sum(pars.filter((_, h) => row.holes[h] != null)) * fmt.balls;
    }
    return row;
  });
  if (fmt.scramble) rows.forEach(r => {
    r.running = r.holes.reduce((s, g, h) => s + (g == null ? 0 : g - pops(r.ph, si[h])), 0);
    r.runningPar = sum(pars.filter((_, h) => r.holes[h] != null));
  });

  const complete = rows.filter(r => r.thru === 18);
  const allIn = rows.length > 0 && complete.length === rows.length;
  const tieBreak = state.config.tieBreak || 'split';
  const keyFor = fmt.scramble ? 'holes' : 'holes';
  // For scramble card-off, compare net holes.
  if (fmt.scramble) rows.forEach(r => { r.netHoles = units.find(u => u.key === r.id).net; });
  const cmpKey = fmt.scramble ? 'netHoles' : 'holes';
  complete.sort((a, b) => a.total - b.total || (tieBreak === 'cards' ? cardOff(a[cmpKey], b[cmpKey]) : 0));
  placeMoney(complete, dc.places || [], tieBreak, cmpKey);
  complete.forEach(r => {
    if (!r.payout) return;
    r.each = Math.round(r.payout / r.pids.length + 1e-9);
    r.payout = r.each * r.pids.length;
    const each = r.each;
    r.pids.forEach(pid => add(pid, each, `${ordinal(r.pos)}${r.tied ? ' (tie)' : ''} place`));
  });
  const incomplete = rows.filter(r => r.thru !== 18).sort((a, b) => (b.thru - a.thru) || ((a.running - a.runningPar) - (b.running - b.runningPar)));
  const standings = complete.concat(incomplete);

  // Skins, played hole by hole in order.
  //   1 low score  -> full skin (plus any carryover)
  //   2 tied low   -> half skin each (of the hole's value incl. carryover)
  //   3+ tied low  -> no skin; the hole's value carries to the next hole
  // Scoring: 'netGrossP3' = net, but gross on par 3s (default); 'net'; 'gross'.
  const skinsType = dc.skinsType || 'netGrossP3';
  const skins = [], carries = [];
  let carry = 0, units_awarded = 0, skinHolesDecided = 0, carryOut = 0;
  for (let h = 0; h < 18; h++) {
    const useGross = skinsType === 'gross' || (skinsType === 'netGrossP3' && pars[h] === 3);
    const scored = units.map(u => ({ u, s: (useGross ? u.gross : u.net)[h] })).filter(x => x.s != null);
    const holeComplete = units.length > 0 && scored.length === units.length;
    if (holeComplete) skinHolesDecided++;
    if (!scored.length) continue;
    const worth = 1 + carry;
    const low = Math.min(...scored.map(x => x.s));
    const at = scored.filter(x => x.s === low);
    if (at.length <= 2) {
      skins.push({ hole: h + 1, par: pars[h], score: low, gross: useGross, worth, final: holeComplete,
        winners: at.map(x => ({ key: x.u.key, pids: x.u.pids, name: x.u.name, share: worth / at.length, grossScore: x.u.gross[h] })) });
      units_awarded += worth; carry = 0;
    } else {
      carries.push({ hole: h + 1, tied: at.length, score: low, worth, final: holeComplete });
      carry = worth;
    }
  }
  carryOut = carry; // value still carrying after the last scored hole (unclaimed)

  const skinValue = units_awarded ? Math.floor(skinsPot / units_awarded * 100) / 100 : 0;

    if (!places.length || !entries.length) return;

  const teamEntries = (a, b) => rows.map(r => ({ key: r.id, pids: r.pids, name: r.name, total: seg(teamHoles(r), a, b) }));
  runGame('teamF9', 'Team front 9', teamEntries(0, 9), parSeg(0, 9) * fmt.balls);
  runGame('teamB9', 'Team back 9', teamEntries(9, 18), parSeg(9, 18) * fmt.balls);
  if (!fmt.scramble) {
    const indiv = rows.flatMap(r => r.members.map(m => ({ pid: m.pid, net: m.net, gross: m.gross })));
    const indEntries = (a, b) => indiv.map(m => ({ key: m.pid, pids: [m.pid], name: state.players[m.pid].name, total: seg(m.net, a, b) }));

    games, skins, carries, carryOut, skinUnits: units_awarded, skinValue, skinsPot, skinsType, skinHolesDecided, contests, money,

}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// Individual net totals across given days (used for Sunday pairing).
function individualNet(state, days) {
  return Object.keys(state.players).map(pid => {
    const p = state.players[pid];
    let total = 0, rounds = 0, detail = {};
    for (const day of days) {
      const card = cappedCard(state, day, pid, playerPH(state, pid, day));
      if (card.some(v => v == null)) { detail[day] = null; continue; }
      const net = sum(card) - playerPH(state, pid, day);
      detail[day] = net; total += net; rounds++;
    }
    return { pid, name: p.name, index: Number(p.index) || 0, total, rounds, detail };
  }).sort((a, b) => (b.rounds - a.rounds) || (a.total - b.total) || (a.index - b.index) || a.name.localeCompare(b.name));
}

function sundayPairs(state) {
  const ranked = individualNet(state, ['fri', 'sat']);
  const n = ranked.length, teams = [];
  for (let i = 0; i < Math.floor(n / 2); i++) {
    teams.push({ id: 'S' + (i + 1), pids: [ranked[i].pid, ranked[n - 1 - i].pid] });
  }
  if (n % 2) teams.push({ id: 'S' + (teams.length + 1), pids: [ranked[Math.floor(n / 2)].pid] });
  return { teams, ranked };
}

// Weekend individual standings: Fri net + Sat net + his Sunday team's net.
function weekendStandings(state, sunDay) {
  const sun = sunDay || computeDay(state, 'sun');
  const sunNet = {};
  sun.standings.forEach(t => { if (t.thru === 18) t.pids.forEach(pid => { sunNet[pid] = t.total; }); });
  const rows = individualNet(state, ['fri', 'sat']).map(r => {
    const s = sunNet[r.pid];
    const rounds = r.rounds + (s != null ? 1 : 0);
    return { pid: r.pid, name: r.name, index: r.index, fri: r.detail.fri, sat: r.detail.sat, sun: s ?? null, rounds, total: r.total + (s ?? 0) };
  });
  const done = rows.filter(r => r.rounds === 3).sort((a, b) => a.total - b.total);
  const rest = rows.filter(r => r.rounds !== 3).sort((a, b) => b.rounds - a.rounds || a.total - b.total);
  const places = (state.config.weekend && state.config.weekend.places) || [];
  let i = 0;
  while (i < done.length) {
    let j = i + 1;
    while (j < done.length && done[j].total === done[i].total) j++;
    let pot = 0; for (let k = i; k < j; k++) pot += Number(places[k]) || 0;
    for (let k = i; k < j; k++) { done[k].pos = i + 1; done[k].tied = j - i > 1; done[k].payout = Math.round(pot / (j - i) + 1e-9); }
    i = j;
  }
  return { list: done.concat(rest), complete: rows.length > 0 && done.length === rows.length, places };
}

function tripMoney(state) {
  const per = {};
  const days = {};
  const blank = () => ({ fri: 0, sat: 0, sun: 0, wknd: 0, total: 0 });
  for (const d of DAYS) {
    days[d] = computeDay(state, d);
    for (const [pid, m] of Object.entries(days[d].money)) {
      (per[pid] = per[pid] || blank());
      per[pid][d] = m.total; per[pid].total = round2(per[pid].total + m.total);
    }
  }
  const weekend = weekendStandings(state, days.sun);
  weekend.list.forEach(r => { if (r.payout) { (per[r.pid] = per[r.pid] || blank()); per[r.pid].wknd = r.payout; per[r.pid].total = round2(per[r.pid].total + r.payout); } });
  const buyIn = Number(state.config.buyIn) || 0;
  const list = Object.keys(state.players).map(pid => {
    const m = per[pid] || blank();
    return { pid, name: state.players[pid].name, ...m, net: round2(m.total - buyIn) };
  }).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  return { list, days, weekend };
}

// Realistic test scores. A player's average gross runs about 3 over his course handicap,
// with more of the damage on the harder (low stroke-index) holes and more scatter for higher handicaps.
function makeTestScores(state, seedIn) {
  let seed = seedIn || 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const normal = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
  const cfg = state.config;
  const card = (course, ch, extra, sdMul) => {
    const over = ch + extra; // expected strokes over par for the round
    const w = course.si.map(si => 1 + 0.7 * (9.5 - si) / 8.5);
    const wsum = w.reduce((a, b) => a + b, 0);
    const sd = (0.55 + Math.max(0, ch) * 0.02) * (sdMul || 1);
    return course.pars.map((par, h) => {
      const exp = par + over * w[h] / wsum;
      const s = Math.round(exp + normal() * sd);
      return Math.max(Math.max(2, par - 2), Math.min(par + 5, s));
    });
  };
  const scores = { fri: {}, sat: {}, sun: {} };
  for (const day of ['fri', 'sat']) {
    const course = cfg.courses[cfg.days[day].course];
    for (const pid of Object.keys(state.players)) {
      const ch = courseHcp(Number(state.players[pid].index) || 0, teeFor(state, pid, day));
      scores[day][pid] = card(course, ch, 3 + normal() * 1.5);
    }
  }
  const sunCourse = cfg.courses[cfg.days.sun.course];
  for (const t of (state.teams.sun || [])) {
    const chs = t.pids.filter(p => state.players[p]).map(p => courseHcp(Number(state.players[p].index) || 0, teeFor(state, p, 'sun'))).sort((a, b) => a - b);
    if (!chs.length) continue;
    // 2-man scramble: roughly 35% of the low man's + 15% of the high man's handicap over par, minus ~3.
    const over = 0.35 * chs[0] + 0.15 * chs[chs.length - 1] - 2 + normal() * 1.5;
    scores.sun[t.id] = card(sunCourse, 0, over, 0.75);
  }
  return scores;
}

function makeSample() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const first = ['Cody','Travis','Wes','Brandon','Kyle','Dustin','Garrett','Shane','Clay','Brent','Tyler','Jared','Colby','Derek','Lance','Russ','Trey','Blake','Chase','Grant','Heath','Jace','Kirk','Luke','Mason','Nate','Owen','Reid','Seth','Tate','Vince','Walt'];
  const last = ['Avery','Bishop','Cole','Dawson','Ellis','Foster','Gaines','Hale','Irwin','Jessup','Keller','Lowe','Mercer','Nash','Oakes','Pruitt','Quinn','Rhodes','Sutton','Tate','Upton','Vance','Wade','Yates','Abbott','Barnes','Crane','Doyle','Eaton','Frey','Gill','Hurst'];
  const players = {};
  for (let i = 0; i < 32; i++) {
    const pid = 'p' + (i + 1);
    players[pid] = { name: first[i] + ' ' + last[i], index: Math.round((1 + rnd() * 23) * 10) / 10 };
  }
  const cfg = defaultConfig();
  const ids = Object.keys(players);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const chunk = (a, n, pre) => { const out = []; for (let i = 0; i < a.length; i += n) out.push({ id: pre + (out.length + 1), pids: a.slice(i, i + n) }); return out; };
  const teams = { fri: chunk(shuffle(ids), 2, 'F'), sat: chunk(shuffle(ids), 4, 'A'), sun: [] };
  const state = { config: cfg, players, teams, scores: { fri: {}, sat: {}, sun: {} }, extras: {} };
  const s1 = makeTestScores(state, 7);
  state.scores.fri = s1.fri; state.scores.sat = s1.sat;
  teams.sun = sundayPairs(state).teams;
  state.scores.sun = makeTestScores(state, 7).sun;
  const extras = {};
  for (const day of ['fri', 'sat', 'sun']) {
    extras[day] = {};
    for (const c of cfg.days[day].contests) extras[day][c.id] = ids[Math.floor(rnd() * ids.length)];
  }
  return { config: cfg, players, teams, scores: state.scores, extras };
}

    let run = 0, any = false; const cum = [];
    for (let h = 0; h < 18; h++) {
      if (holes[h] == null) { cum.push(null); continue; }
      run += holes[h] - pars[h] * balls; any = true; cum.push(run);
    }
    const names = t.pids.map(pid => S.players[pid] ? S.players[pid].name : '?');
    return { id: t.id, names, thru: t.thru, toPar: t.thru === 18 && t.toPar != null ? t.toPar : any ? run : null, cum, payout: t.payout, final: t.thru === 18 };
  });
  rows.sort((a, b) => (a.toPar == null) - (b.toPar == null) || (a.toPar ?? 0) - (b.toPar ?? 0) || b.thru - a.thru || a.names[0].localeCompare(b.names[0]));
  let i = 0;
  while (i < rows.length) {
    let j = i + 1;
    while (j < rows.length && rows[j].toPar === rows[i].toPar) j++;
    for (let k = i; k < j; k++) rows[k].pos = rows[i].toPar == null ? '' : (j - i > 1 ? 'T' : '') + (i + 1);
    i = j;
  }
  return { r, rows };
}

function splitName(n) { const p = String(n).trim().split(/\s+/); return p.length > 1 ? { first: p[0], last: p.slice(1).join(' ') } : { first: '', last: p[0] }; }
let nameCache = { key: null, short: {}, last: {} };
function nameLabels() {
  const all = Object.values(S.players).map(p => p.name);
  const key = all.join('|');
  if (nameCache.key === key) return nameCache;
  const count = (arr) => arr.reduce((m, v) => (m[v] = (m[v] || 0) + 1, m), {});
  const parts = Object.fromEntries(all.map(n => [n, splitName(n)]));
  const initials = count(all.map(n => (parts[n].first[0] || '') + '|' + parts[n].last.toLowerCase()));
  const lasts = count(all.map(n => parts[n].last.toLowerCase()));
  const short = {}, last = {};
  for (const n of all) {
    const { first, last: l } = parts[n];
    short[n] = !first ? l : initials[first[0] + '|' + l.toLowerCase()] > 1 ? first + ' ' + l : first[0] + '. ' + l;
    last[n] = lasts[l.toLowerCase()] > 1 && first ? short[n] : l;
  }
  nameCache = { key, short, last };
  return nameCache;
}
function lastName(n) { return nameLabels().last[n] || splitName(n).last; }
function shortName(n) { return nameLabels().short[n] || n; }

  // Sunday counts live: a team still on the course carries its running net to par.
  const sunTP = {};
  boardRows('sun').rows.forEach(t => { if (t.toPar != null) S.teams.sun.find(x => x.id === t.id).pids.forEach(pid => { if (pid) sunTP[pid] = t.toPar; }); });

// Live Sunday pairing projection: each player's individual net to par over every
// Friday/Saturday hole entered so far. Same order the "Pair" button uses once cards are complete.
function liveSeeds() {
  const out = Object.keys(S.players).map(pid => {
    const p = S.players[pid]; let tp = 0, holes = 0;
    for (const d of ['fri', 'sat']) {
      const course = S.config.courses[S.config.days[d].course];
      const ph = playerPH(S, pid, d);
      const card = cappedCard(S, d, pid, ph);
      for (let h = 0; h < 18; h++) {
        const g = card[h]; if (g == null || g === '' || isNaN(Number(g))) continue;
        tp += Number(g) - pops(ph, course.si[h]) - course.pars[h]; holes++;
      }
    }
    return { pid, name: p.name, index: Number(p.index) || 0, tp: holes ? tp : null, holes };
  });
  out.sort((a, b) => (a.tp == null) - (b.tp == null) || (a.tp ?? 0) - (b.tp ?? 0) || a.index - b.index || a.name.localeCompare(b.name));
  return out;
}

function boardPairs() {
  const seeds = liveSeeds(), n = seeds.length;
  let pairs = [];
  // Once Sunday's teams are entered, show those matchups (in team order) instead of the projection.
  const idx = Object.fromEntries(seeds.map((s, i) => [s.pid, i]));
  const setTeams = ((S.teams && S.teams.sun) || []).map(t => (t.pids || []).filter(p => p && idx[p] != null)).filter(p => p.length);
  const entered = setTeams.length > 0;
  if (entered) pairs = setTeams.map(p => { const a = idx[p[0]], z = p.length > 1 ? idx[p[1]] : null; return z != null && z < a ? [z, a] : [a, z]; });
  else {
    for (let i = 0; i < Math.floor(n / 2); i++) pairs.push([i, n - 1 - i]);

function keepGroups(day) {

function rememberGroup(day, n) { const m = myGroups(); m[day] = n; try { localStorage.setItem('wyd-mygroup', JSON.stringify(m)); } catch (e) {} }
function ctpContest(day, h) { return (S.config.days[day].contests || []).find(c => c.type === 'CTP' && Number(c.hole) === h + 1); }
function ctpSaved(day, cid, n) { const e = S.extras && S.extras[day] && S.extras[day].ctp && S.extras[day].ctp[cid]; return e && e['g' + n] ? e['g' + n] : null; }
const fmtDist = (e) => e && e.pid ? (Number(e.ft) || 0) + "' " + (Number(e.inch) || 0) + '"' : '';

function viewKeep() {
  if (!ui.kday) ui.kday = defaultKeepDay();
  const day = ui.kday;

  if (!canWrite) return dayChips + `<section class="panel"><h2>Keep score</h2><p class="muted">Enter the scorekeeper PIN to keep score for your group.</p><div class="row"><button class="btn primary" data-act="pin-open">Enter PIN</button></div></section>`;
  if (ui.kgroup == null && !ui.kpick) { const m = myGroups()[day]; if (m && groups.some(x => x.n === m)) { ui.kgroup = m; ui.khole = null; } }
  const g = groups.find(x => x.n === ui.kgroup);
  if (!g) {
    const mine = myGroups()[day];
    const list = groups.map(x => { const thru = groupThru(day, x); const names = x.teams.flatMap(t => t.pids.filter(p => S.players[p]).map(p => S.players[p].name));
      return `<button class="kp-group ${mine === x.n ? 'mine' : ''}" data-act="kgroup" data-n="${x.n}"><span><b>Group ${x.n}${mine === x.n ? ' · yours' : ''}</b><span class="kp-names">${names.map(esc).join('<br>')}</span></span><span class="thru ${thru === 18 ? 'done' : ''}">${thru === 18 ? '✓ Done' : thru ? 'Through ' + thru : 'Start'}</span></button>`; }).join('');
    return dayChips + `<section class="panel"><div><h2>Who's in your group?</h2><div class="muted">${DAY_LABEL[day]} at ${esc(course.name)}. Tap your group. This phone remembers it.</div></div>
      ${groups.length ? `<div class="kp-groups">${list}</div>` : '<div class="empty">No teams set for this day yet.</div>'}</section>`;
  }
  const sync = (navigator.onLine === false) ? `<div class="kp-sync off">No signal. Scores are saved on this phone and will send when you have signal.</div>` : ui.pending ? `<div class="kp-sync wait">Sending scores…</div>` : `<div class="kp-sync ok">✓ All scores sent</div>`;
  const head = `<div class="row between"><button class="btn" data-act="kchange">Change group</button><span class="muted">${DAY_LABEL[day]} · Group ${g.n}</span></div>${sync}`;
  if (isLocked(day)) return head + `<section class="panel"><h2>${DAY_LABEL[day]} is final</h2><p>The admin locked ${DAY_LABEL[day]}'s scores. If something's wrong, tell the admin.</p></section>`;
  const undo = ui.kundo && ui.kundo.until > Date.now() && ui.kundo.day === day ? `<div class="undo"><span>Hole ${ui.kundo.h + 1} saved.</span><button class="btn" data-act="kundo">Undo</button></div>` : '';
  if (ui.kreview) return head + undo + reviewCard(day, g, course, ui.kreview === 'front');
  const h = ui.khole == null ? firstOpenHole(day, g) : ui.khole;
  ui.khole = h;
  const par = course.pars[h], si = course.si[h];
  ui.kvals = ui.kvals || {};
  const capOf = (u) => maxFor(S, day, u.ph, h);
  const val = (u) => { const k = day + '|' + u.key + '|' + h; const v = ui.kvals[k] != null ? ui.kvals[k] : savedScore(day, u.key, h) ?? par; return Math.min(v, capOf(u)); };
  const isSet = (u) => ui.kvals[day + '|' + u.key + '|' + h] != null || savedScore(day, u.key, h) != null;
  const yards = [...new Set(g.units.map(u => holeYards(day, u.pid, h)).filter(Boolean))];
  const thruLine = (u) => {
    let gross = 0, net = 0, parT = 0, n = 0;
    for (let k = 0; k < 18; k++) { let s = k === h ? (isSet(u) ? val(u) : null) : savedScore(day, u.key, k); if (s == null) continue; s = Math.min(s, maxFor(S, day, u.ph, k)); gross += s; net += s - pops(u.ph, course.si[k]); parT += course.pars[k]; n++; }
    return n ? `Through ${n}: ${gross}, net ${toParStr(net - parT)}` : '';
  };
  const rule = maxRule(S, day);
  const rows = g.units.map(u => {
    const p = pops(u.ph, si), v = val(u), d = v - par, cap = capOf(u), atMax = rule.type !== 'none' && v >= cap;
    const word = atMax ? 'Max' : d <= -2 ? 'Eagle' : d === -1 ? 'Birdie' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double' : '+' + d;
    const outAsk = ui.kout === u.key ? `<div class="kp-out-ask"><span>Mark <b>${esc(u.name)}</b> out for the rest of the round? He gets the max on this hole and every hole after it.</span><span class="row"><button class="btn" data-act="kout-no">Cancel</button><button class="btn danger armed" data-act="kout-yes" data-key="${esc(u.key)}">Yes, he's out</button></span></div>` : '';
    return `<div class="kp-row ${atMax ? 'atmax' : ''}">
      <b class="kp-nm">${esc(u.name)}</b><div class="kp-who"><span>${p > 0 ? '<i class="kp-pop">' + '●'.repeat(p) + '</i> gets ' + p + ' stroke' + (p > 1 ? 's' : '') : p < 0 ? 'gives a stroke' : 'no stroke'}${rule.type !== 'none' ? ' · max ' + cap : ''}</span><span class="kp-run">${thruLine(u)}</span>
        <span class="kp-mini"><button class="link" data-act="kmax" data-key="${esc(u.key)}">MAX</button>${FORMATS[dc.format].scramble ? '' : `<button class="link" data-act="kout" data-key="${esc(u.key)}">Out</button>`}</span></div>
      <div class="kp-ctl">
        <button class="kp-btn" data-act="kminus" data-key="${esc(u.key)}" aria-label="One less for ${esc(u.name)}">−</button>
        <div class="kp-score ${isSet(u) ? '' : 'default'} ${d < 0 ? 'u' : d > 0 ? 'o' : ''}"><b>${v}</b><small>${word}${p > 0 ? ' · net ' + (v - p) : ''}</small></div>
        <button class="kp-btn" data-act="kplus" data-key="${esc(u.key)}" ${v >= cap ? 'disabled' : ''} aria-label="One more for ${esc(u.name)}">+</button>

  }).join('');
  // Closest to the pin on par 3s with a contest
  const cc = ctpContest(day, h);
  let ctp = '';
  if (cc) {
    ui.kctp = ui.kctp || {};
    const ck = day + '|' + cc.id + '|' + g.n, draft = ui.kctp[ck] || ctpSaved(day, cc.id, g.n) || {};
    const opts = `<option value="">Nobody on the green</option>` + g.units.flatMap(u => FORMATS[dc.format].scramble ? (S.teams[day].find(t => t.id === u.key) || { pids: [] }).pids : [u.key]).filter(p => S.players[p]).map(p => `<option value="${p}" ${draft.pid === p ? 'selected' : ''}>${esc(S.players[p].name)}</option>`).join('');
    const on = draft.on != null ? draft.on : (draft.pid ? true : null);
    ctp = `<div class="kp-ctp"><b>Closest to the pin · ${fmt$(cc.amt)}</b><span>Anyone in your group on the green?</span>
      <div class="row"><button class="btn ${on === true ? 'primary' : ''}" data-act="kctp-yes">Yes</button><button class="btn ${on === false ? 'primary' : ''}" data-act="kctp-no">No</button></div>
      ${on ? `<span class="muted small">Who's closest, and how far? The app keeps the best one across all groups.</span><div class="row"><select id="kctp-p" data-kctp="pid">${opts.replace('Nobody on the green', 'Pick a name')}</select>
      <label class="kp-dist"><input id="kctp-ft" data-kctp="ft" inputmode="numeric" value="${esc(draft.ft ?? '')}" placeholder="0"> ft</label>
      <label class="kp-dist"><input id="kctp-in" data-kctp="inch" inputmode="numeric" value="${esc(draft.inch ?? '')}" placeholder="0"> in</label></div>` : ''}</div>`;
  }
  const flagged = g.units.filter(u => val(u) <= par - 2);
  const flagAsk = ui.kflag === h && flagged.length ? `<div class="banner"><p><b>Double-check:</b> ${flagged.map(u => esc(u.name) + ' ' + val(u)).join(', ')} on a par ${par}. That right?</p><div class="row"><button class="btn" data-act="kflag-no">Let me fix it</button><button class="btn primary" data-act="ksave" data-ok="1">Yes, save it</button></div></div>` : '';
  const dots = course.pars.map((pp, k) => { const done = g.units.every(u => savedScore(day, u.key, k) != null); return `<button class="kp-dot ${k === h ? 'on' : ''} ${done ? 'done' : ''}" data-act="khole" data-h="${k}" aria-label="Hole ${k + 1}">${k + 1}</button>`; }).join('');
  const allDone = groupThru(day, g) === 18;
  return head + undo + `
  <section class="panel kp">
    <div class="kp-dots">${dots}</div>
    <div class="kp-head">
      <div class="kp-meta"><div class="kp-hn">Hole ${h + 1}</div><div class="kp-par">Par ${par}</div>
        <div class="muted">${yards.length ? yards.map(y => y + ' yds').join(' / ') + ' · ' : ''}Handicap ${si}</div>
        <div class="muted small">Scores start at par. Tap − or + to change, then save.${rule.type !== 'none' ? ' Max is ' + MAX_RULES[rule.type].toLowerCase() + (rule.type === 'fixed' ? ' (' + rule.value + ')' : '') + '.' : ''}</div></div></div>
    <div class="kp-rows">${rows}</div>
    ${ctp}${flagAsk}
    <div class="kp-nav">
      ${h > 0 ? `<button class="btn" data-act="kprev">← Hole ${h}</button>` : ''}
      <button class="btn primary kp-next" data-act="ksave">${h === 17 ? 'Save hole 18 · check the card' : h === 8 ? 'Save · check the front 9' : 'Save · next hole →'}</button>
    </div>
    ${allDone ? '<div class="row"><button class="btn" data-act="kreview">Review the full card</button></div>' : ''}
  </section>`;
}

function reviewCard(day, g, course, front) {
  if (front) {
    const rowsF = g.units.map(u => { const arr = cappedCard(S, day, u.key, u.ph).slice(0, 9); const out = arr.reduce((s, v) => s + (v || 0), 0);
      return `<tr><td><b>${esc(u.name)}</b></td>${arr.map((v, h) => `<td><button class="kp-cell" data-act="khole-fix" data-h="${h}">${v == null ? '–' : v}</button></td>`).join('')}<td class="tot">${out}</td></tr>`; }).join('');
    return `<section class="panel"><h2>Front 9 done</h2><div class="muted">Compare with the paper card. Tap any score to fix it.</div>
      <div class="tbl-wrap"><table class="card"><thead><tr><th>Hole</th>${[...Array(9).keys()].map(h => `<th>${h + 1}</th>`).join('')}<th class="tot">Out</th></tr></thead><tbody>
      <tr class="meta"><td>Par</td>${course.pars.slice(0, 9).map(p => `<td>${p}</td>`).join('')}<td class="tot">${course.pars.slice(0, 9).reduce((a, b) => a + b, 0)}</td></tr>${rowsF}</tbody></table></div>
      <div class="row"><button class="btn primary kp-next" data-act="kfront-ok">Looks right · start the back 9</button></div></section>`;
  }
  const rows = g.units.map(u => {
    const arr = cappedCard(S, day, u.key, u.ph);
    const sumR = (a, b) => arr.slice(a, b).reduce((s, v) => s + (v || 0), 0);
    const missing = arr.filter(v => v == null).length;
    const gross = sumR(0, 18), net = gross - u.ph;
    return `<tr><td><b>${esc(u.name)}</b></td><td class="num">${sumR(0, 9)}</td><td class="num">${sumR(9, 18)}</td><td class="num"><b>${gross}</b></td><td class="num">${missing ? '<span class="bad">' + missing + ' missing</span>' : net + ' <span class="muted small">' + toParStr(net - course.pars.reduce((a, b) => a + b, 0)) + '</span>'}</td></tr>`;
  }).join('');
  const holes = [...Array(18).keys()];
  const grid = `<div class="tbl-wrap"><table class="card"><thead><tr><th>Hole</th>${holes.map(h => `<th>${h + 1}</th>`).join('')}</tr></thead><tbody>
    <tr class="meta"><td>Par</td>${course.pars.map(p => `<td>${p}</td>`).join('')}</tr>
    ${g.units.map(u => { const arr = cappedCard(S, day, u.key, u.ph); return `<tr><td>${esc(u.name.split(' ').slice(-1)[0])}</td>${arr.map((v, h) => `<td><button class="kp-cell" data-act="khole-fix" data-h="${h}">${v == null ? '–' : v}</button></td>`).join('')}</tr>`; }).join('')}
  </tbody></table></div>`;
  return `<section class="panel"><h2>Check the card</h2><div class="muted small">Compare with the paper card. Tap any score to fix that hole.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Player</th><th class="num">Out</th><th class="num">In</th><th class="num">Gross</th><th class="num">Net</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${grid}
    <div class="row"><button class="btn primary" data-act="kdone">Looks right · done</button></div></section>`;
}

async function keepAction(act, b) {
  const day = ui.kday;
  if (act === 'kday') { ui.kday = b.dataset.day; ui.kgroup = null; ui.khole = null; ui.kpick = false; ui.kreview = false; return render(); }
  if (act === 'kgroup') { ui.kgroup = Number(b.dataset.n); rememberGroup(day, ui.kgroup); ui.khole = null; ui.kpick = false; ui.kreview = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'kback' || act === 'kchange') { ui.kgroup = null; ui.khole = null; ui.kpick = true; ui.kreview = false; return render(); }
  if (act === 'kfront-ok') { ui.kreview = false; ui.khole = 9; render(); window.scrollTo(0, 0); return; }
  if (act === 'kundo') {
    const u = ui.kundo; ui.kundo = null; if (!u || u.day !== day) return render();
    saveScores(day, u.prev); ui.khole = u.h; ui.kreview = false; toast('Hole ' + (u.h + 1) + ' put back the way it was.'); return render();
  }
  if (act === 'kctp-yes' || act === 'kctp-no') {
    const cc = ctpContest(day, ui.khole); if (!cc) return;
    ui.kctp = ui.kctp || {}; const ck = day + '|' + cc.id + '|' + ui.kgroup;
    const d = ui.kctp[ck] = ui.kctp[ck] || Object.assign({}, ctpSaved(day, cc.id, ui.kgroup) || {});
    d.on = act === 'kctp-yes'; if (!d.on) { d.pid = ''; d.ft = ''; d.inch = ''; }
    return render();
  }
  if (act === 'khole' || act === 'khole-fix') { ui.khole = Number(b.dataset.h); ui.kreview = false; ui.kflag = null; render(); window.scrollTo(0, 0); return; }
  if (act === 'kprev') { ui.khole = Math.max(0, ui.khole - 1); ui.kflag = null; return render(); }
  if (act === 'kreview') { ui.kreview = true; render(); window.scrollTo(0, 0); return; }
  if (act === 'kdone') { ui.kreview = false; ui.kgroup = null; ui.khole = null; ui.kpick = true; toast('Card done. Thanks!'); return render(); }
  if (act === 'kout-no') { ui.kout = null; return render(); }
  if (act === 'kflag-no') { ui.kflag = null; return render(); }
  const g = keepGroups(day).find(x => x.n === ui.kgroup); if (!g) return render();
  const h = ui.khole, course = S.config.courses[S.config.days[day].course], par = course.pars[h];
  const unit = (key) => g.units.find(u => u.key === key);
  const cur = (key) => { const k = day + '|' + key + '|' + h; const v = ui.kvals[k] != null ? ui.kvals[k] : savedScore(day, key, h) ?? par; return Math.min(v, maxFor(S, day, unit(key).ph, h)); };
  if (act === 'kminus' || act === 'kplus') {
    const key = b.dataset.key, k = day + '|' + key + '|' + h, cap = maxFor(S, day, unit(key).ph, h);
    ui.kvals[k] = Math.max(1, Math.min(cap, cur(key) + (act === 'kplus' ? 1 : -1)));
    return render();
  }
  if (act === 'kmax') { const key = b.dataset.key; ui.kvals[day + '|' + key + '|' + h] = maxFor(S, day, unit(key).ph, h); return render(); }
  if (act === 'kout') { ui.kout = b.dataset.key; return render(); }
  const save = (out) => saveScores(day, out);      // not awaited: works offline, sends when back online; logged
  if (act === 'kout-yes') {
    const u = unit(b.dataset.key); ui.kout = null;
    const arr = ((S.scores[day] && S.scores[day][u.key]) || new Array(18).fill(null)).slice(); while (arr.length < 18) arr.push(null);
    for (let k = h; k < 18; k++) if (arr[k] == null || k === h) arr[k] = maxFor(S, day, u.ph, k);
    save({ [u.key]: arr }); toast(u.name + ' marked out. Max scores entered for the rest of the round.'); return render();
  }
  if (act === 'ksave') {
    if (!b.dataset.ok && g.units.some(u => cur(u.key) <= par - 2)) { ui.kflag = h; return render(); }
    ui.kflag = null;
    if (isLocked(day)) { toast(DAY_LABEL[day] + ' is locked.'); return render(); }
    const out = {}, prev = {};
    g.units.forEach(u => {
      const arr = ((S.scores[day] && S.scores[day][u.key]) || new Array(18).fill(null)).slice();
      while (arr.length < 18) arr.push(null);
      prev[u.key] = arr.slice();
      arr[h] = cur(u.key); out[u.key] = arr;
      delete ui.kvals[day + '|' + u.key + '|' + h];
    });
    save(out);
    ui.kundo = { day, h, prev, until: Date.now() + 6000 }; clearTimeout(keepAction.ut); keepAction.ut = setTimeout(() => { if (ui.kundo && ui.kundo.until <= Date.now() + 50) { ui.kundo = null; if (ui.tab === 'keep') render(); } }, 6100);
    const cc = ctpContest(day, h);
    if (cc) {
      const ck = day + '|' + cc.id + '|' + g.n, d = (ui.kctp && ui.kctp[ck]) || ctpSaved(day, cc.id, g.n);
      if (d && (d.on != null || d.pid)) writeDoc('extras', { [day]: { ctp: { [cc.id]: { ['g' + g.n]: d.on !== false && d.pid ? { pid: d.pid, ft: Number(d.ft) || 0, inch: Number(d.inch) || 0 } : null } } } }, true);
      if (ui.kctp) delete ui.kctp[ck];
    }
    if (h === 8 && g.units.every(u => (S.scores[day][u.key] || []).slice(0, 9).every(v => v != null))) { ui.kreview = 'front'; ui.khole = 9; }
    else if (h < 17) { ui.khole = h + 1; }
    else { ui.kreview = true; }
    render(); window.scrollTo(0, 0); return;
  }
}
// CTP fields on the hole screen keep a draft until the hole is saved.
document.addEventListener('input', (e) => {
  const f = e.target.dataset && e.target.dataset.kctp; if (!f || !ui.kgroup) return;
  const cc = ctpContest(ui.kday, ui.khole); if (!cc) return;
  ui.kctp = ui.kctp || {};
  const ck = ui.kday + '|' + cc.id + '|' + ui.kgroup, d = ui.kctp[ck] = ui.kctp[ck] || Object.assign({}, ctpSaved(ui.kday, cc.id, ui.kgroup) || {});
  d[f] = f === 'pid' ? e.target.value : e.target.value.replace(/[^0-9]/g, '');
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.kctp === 'pid') e.target.dispatchEvent(new Event('input', { bubbles: true })); });

// ===== Streamlined views: Right Now, Leaderboard, Money, drill-down sheets, settings, Admin hub =====
// Expects the app scope from ui.html plus board.js (boardRows, shortName, lastName, tpStr, autoBoardDay)
// and keep.js (keepGroups, todayISO).

// ---------- small helpers ----------
const MY_KEY = 'wyd-me';
function meId() { try { const m = localStorage.getItem(MY_KEY); return m && S.players[m] ? m : null; } catch (e) { return null; } }
function setMe(pid) { try { if (pid) localStorage.setItem(MY_KEY, pid); else localStorage.removeItem(MY_KEY); } catch (e) {} }
function placeWord(pos) {
  if (pos == null || pos === '') return '';
  const s = String(pos), tied = s.startsWith('T'), n = Number(s.replace('T', ''));
  return (tied ? 'tied for ' : '') + ordinal(n);
}
function underWord(n) {
  if (n == null) return '';
  const r = Math.round(n * 100) / 100;
  return r === 0 ? 'even par' : Math.abs(r) + (r < 0 ? ' under' : ' over');
}
function agoText(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  return s < 45 ? 'just now' : s < 90 ? '1 min ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' hr ago';
}
setInterval(() => { document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = agoText(Number(el.dataset.ago)); }); }, 20000);
function dayNow() { const t = todayISO(), d = DAYS.find(x => S.config.days[x].date === t); return d || autoBoardDay(); }
function dayStarted(day) { return Object.values(S.scores[day] || {}).some(c => Array.isArray(c) && c.some(v => v != null && v !== '')); }
function isLocked(day) { return !!(S.config.locks && S.config.locks[day]); }
function courseOf(day) { return S.config.courses[S.config.days[day].course]; }
function namesOf(pids, short) { return pids.filter(p => S.players[p]).map(p => short ? shortName(S.players[p].name) : S.players[p].name); }
function teamOfPid(day, pid) { return (S.teams[day] || []).find(t => (t.pids || []).includes(pid)); }
const LB_DAYS = { fri: 'Fri', sat: 'Sat', sun: 'Sun' };

// One leaderboard row, used everywhere on phones.
function lbRow(o) {
  return `<button class="lb-row ${o.me ? 'me' : ''} ${o.money ? 'paid' : ''}" ${o.act || ''}>
    <span class="lb-rank">${esc(o.rank ?? '')}</span>
    <span class="lb-name"><b>${o.nameHtml || esc(o.name)}</b>${o.sub ? `<small>${o.sub}</small>` : ''}</span>
    <span class="lb-right"><span class="lb-score ${o.scoreCls || ''}">${o.score ?? ''}</span>${o.money ? `<span class="lb-money">${fmt$(o.money)}</span>` : ''}</span></button>`;
}
// Team names that fit on a phone: 4-man teams by last name, 2-man by initial + last name.

    <tr class="meta"><td>Par</td>${course.pars.slice(0, 9).map(p => `<td>${p}</td>`).join('')}<td class="tot">${parT(0, 9)}</td>${course.pars.slice(9).map(p => `<td>${p}</td>`).join('')}<td class="tot">${parT(9, 18)}</td><td class="tot">${parT(0, 18)}</td></tr>

      ${g.list.length ? g.list.filter((x, i) => x.payout || i < Math.max(3, g.places.length)).map(x => `<div class="skin"><span><span class="hole">${x.tied ? 'T' : ''}${x.pos}</span>${esc(x.name)} <span class="muted small">${toParStr(x.toPar)}</span></span><span class="money ${x.payout ? '' : 'zero'}">${x.payout ? fmt$(x.payout) : ''}</span></div>`).join('') : '<div class="muted small">No complete scores yet.</div>'}</div>`).join('')}</div></section>` : ''}

// Rank labels with ties ("T3") for a list already sorted by val (null values get no rank).
function rankLabels(list, val) {
  const out = []; let i = 0;
  while (i < list.length) {
    const v = val(list[i]); let j = i + 1;
    if (v == null) { out.push(''); i++; continue; }
    while (j < list.length && val(list[j]) === v) j++;
    for (let k = i; k < j; k++) out.push((j - i > 1 ? 'T' : '') + (i + 1));
    i = j;
  }
  return out;
}
// Sortable header button. uiKey holds the active sort for that table.
function sortTh(uiKey, k, label, cls = 'num') {
  const on = ui[uiKey] === k;
  return `<th class="${cls}"><button class="sortbtn ${on ? 'on' : ''}" data-act="tsort" data-t="${uiKey}" data-k="${k}">${label}${on ? ' ▾' : ''}</button></th>`;
}
// Sort rows by a numeric key (low first unless desc), blanks last, then by name.
function sortRows(rows, val, desc) {
  return rows.sort((a, b) => { const x = val(a), y = val(b);
    if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y));
    if (x == null || y == null) return (x == null) - (y == null) || a.name.localeCompare(b.name);
    return (desc ? y - x : x - y) || a.name.localeCompare(b.name); });
}

// Every player's own gross and net for each day. Sunday is a team scramble, so it shows the team's card.
function viewPlayerScores() {
  const parOf = (d) => S.config.courses[S.config.days[d].course].pars.reduce((a, b) => a + b, 0);
  const sun = computeDay(S, 'sun');
  const sunBy = {};
  sun.standings.forEach(t => t.pids.forEach(pid => { sunBy[pid] = t; }));
  const dayCell = (pid, d) => {
    const ph = computeDayPH(pid, d);
    const card = cappedCard(S, d, pid, ph);
    const holes = card.filter(v => v != null).length;
    if (!holes) return { g: null, n: null, holes: 0 };
    const g = card.reduce((s, v) => s + (Number(v) || 0), 0);
    if (holes === 18) return { g, n: g - ph, ph, holes, tp: g - ph - parOf(d) };
    const course = S.config.courses[S.config.days[d].course];
    let net = 0, par = 0; card.forEach((v, h) => { if (v != null && v !== '') { net += Number(v) - pops(ph, course.si[h]); par += course.pars[h]; } });
    return { g, n: net, ph, holes, tp: net - par };
  };
  const rows = Object.keys(S.players).map(pid => {
    const fri = dayCell(pid, 'fri'), sat = dayCell(pid, 'sat'), t = sunBy[pid];
    const sunC = t && t.thru ? { g: t.grossTotal, n: t.thru === 18 ? t.total : null, holes: t.thru, tp: t.thru === 18 ? t.toPar : null } : { g: null, n: null, holes: 0 };
    const both = fri.holes === 18 && sat.holes === 18 ? fri.n + sat.n : null;
    const all3 = fri.holes === 18 && sat.holes === 18 && sunC.holes === 18;
    return { pid, name: S.players[pid].name, index: Number(S.players[pid].index) || 0, fri, sat, sun: sunC, both,
      wg: all3 ? fri.g + sat.g + sunC.g : null, wn: all3 ? fri.n + sat.n + sunC.n : null };
  });
  const sort = ui.psort || 'wn';
  const f18 = (c, k) => c.holes === 18 ? c[k] : null;
  const keys = { name: r => r.name, index: r => r.index,
    friG: r => f18(r.fri, 'g'), fri: r => f18(r.fri, 'n'), satG: r => f18(r.sat, 'g'), sat: r => f18(r.sat, 'n'),
    sunG: r => f18(r.sun, 'g'), sun: r => r.sun.n, both: r => r.both, wg: r => r.wg, wn: r => r.wn };
  const rankKey = ['name', 'index'].includes(sort) ? 'wn' : sort;
  sortRows(rows, keys[sort]);
  const ranks = ['name', 'index'].includes(sort) ? null : rankLabels(rows, keys[sort]);
  // When sorted by name or index, rank still shows the weekend net finish.
  const wnRank = {}; if (!ranks) { const byWn = sortRows(rows.slice(), keys.wn); rankLabels(byWn, keys.wn).forEach((r, i) => { wnRank[byWn[i].pid] = r; }); }
  const tp = (n) => n == null ? '' : `<span class="muted small"> ${toParStr(n)}</span>`;
  const g = (c) => c.holes ? (c.holes < 18 ? `${c.g}<span class="muted small"> thru ${c.holes}</span>` : c.g) : '<span class="muted">–</span>';
  const n = (c) => c.holes === 18 ? `<b>${c.n}</b>${tp(c.tp)}` : c.holes ? `<span class="muted small">${toParStr(c.tp)} so far</span>` : '<span class="muted">–</span>';
  const sunN = (c) => c.n != null ? `<b>${c.n}</b>${tp(c.tp)}` : c.holes ? '<span class="muted small">playing</span>' : '<span class="muted">–</span>';
  const tot = (v) => v != null ? '<b>' + v + '</b>' : '<span class="muted">–</span>';
  const th = (k, label, cls = 'num') => `<th class="${cls}"><button class="sortbtn ${sort === k ? 'on' : ''}" data-act="psort" data-k="${k}">${label}${sort === k ? ' ▾' : ''}</button></th>`;
  const body = rows.map((r, i) => `<tr><td class="pos">${ranks ? ranks[i] : wnRank[r.pid] || ''}</td><td>${esc(r.name)}</td><td class="num">${r.index.toFixed(1)}</td>
    <td class="num">${g(r.fri)}</td><td class="num">${n(r.fri)}</td>
    <td class="num">${g(r.sat)}</td><td class="num">${n(r.sat)}</td>
    <td class="num">${g(r.sun)}</td><td class="num">${sunN(r.sun)}</td>
    <td class="num">${tot(r.both)}</td><td class="num">${tot(r.wg)}</td><td class="num">${tot(r.wn)}</td></tr>`).join('');
  const rankNote = ranks ? '' : ' Rank shows the full-weekend net finish while sorted by name or index.';
  return `<section class="panel"><div class="row between"><div><h2>Player Scores</h2><div class="muted small">Each player's own gross and net (gross minus his course handicap for that day's tees). Sunday is the scramble, so it shows his team's card. Full weekend = Friday + Saturday + Sunday team. Tap any column to sort; Rank follows the column you sort by.${rankNote}</div></div></div>
    <div class="tbl-wrap"><table class="pscores stick2"><thead>
      <tr><th></th><th></th><th></th><th class="num grp" colspan="2">Friday · ${esc(S.config.courses[S.config.days.fri.course].name)}</th><th class="num grp" colspan="2">Saturday · ${esc(S.config.courses[S.config.days.sat.course].name)}</th><th class="num grp" colspan="2">Sunday team · ${esc(S.config.courses[S.config.days.sun.course].name)}</th><th></th><th class="num grp" colspan="2">Full weekend</th></tr>
      <tr><th>Rank</th>${th('name', 'Player', '')}${th('index', 'Index')}${th('friG', 'Gross')}${th('fri', 'Net')}${th('satG', 'Gross')}${th('sat', 'Net')}${th('sunG', 'Gross')}${th('sun', 'Net')}${th('both', 'Fri + Sat net')}${th('wg', 'Gross')}${th('wn', 'Net')}</tr>
    </thead><tbody>${body}</tbody></table></div></section>`;
}

function viewTrip() {

  const rows = mlist.map((p, i) => `<tr class="${p.total ? 'paid' : ''}"><td class="pos">${mranks[i]}</td><td>${esc(p.name)}</td>${DAYS.concat('wknd').map(d => `<td class="num">${p[d] ? fmt$(p[d]) : '<span class="muted">–</span>'}</td>`).join('')}<td class="num money ${p.total ? '' : 'zero'}">${fmt$(p.total)}</td><td class="num score ${p.net >= 0 ? 'ok' : 'muted'}">${p.net >= 0 ? '+' : '−'}${fmt$(Math.abs(p.net))}</td></tr>`).join('');

    <div class="tbl-wrap"><table class="stick2"><thead><tr><th>Rank</th>${sortTh('msort', 'name', 'Player', '')}${sortTh('msort', 'fri', 'Fri')}${sortTh('msort', 'sat', 'Sat')}${sortTh('msort', 'sun', 'Sun')}${sortTh('msort', 'wknd', 'Weekend')}${sortTh('msort', 'total', 'Won')}${sortTh('msort', 'net', 'Net vs ' + fmt$(buyIn))}</tr></thead><tbody>${rows}</tbody></table></div></section>

  <section class="panel"><div><h3>Individual net, Friday + Saturday</h3><div class="muted small">Each player's own net score (gross minus course handicap) for both rounds. This ranking seeds Sunday's scramble: #1 plays with last place, #2 with second-to-last, and so on. Tap a column to sort; Rank is always the seed.</div></div>

// ---- score entry ----
function teamsFor(day) { return (S.teams[day] || []).filter(t => t.pids && t.pids.some(p => p && S.players[p])); }
function draftKey(day, key) { return day + '|' + key; }
function cardValues(day, key) {
  const d = ui.drafts[draftKey(day, key)];
  if (d) return d;
  const c = S.scores[day] && S.scores[day][key];
  return Array.isArray(c) ? c.map(v => v == null ? '' : String(v)) : new Array(18).fill('');
}
function markClass(v, par) {
  const n = Number(v); if (v === '' || isNaN(n)) return '';
  const d = n - par; return d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 1 ? 'bogey' : d >= 2 ? 'dbl' : '';
}
function viewScores() {
  const day = ui.sday, dc = S.config.days[day], fmt = FORMATS[dc.format], course = S.config.courses[dc.course];
  const teams = teamsFor(day);
  const r = computeDay(S, day);
  const byId = Object.fromEntries(r.standings.map(t => [t.id, t]));
  if (!teams.find(t => t.id === ui.team)) ui.team = teams[0] ? teams[0].id : null;
  const list = teams.map((t, i) => { const st = byId[t.id]; const thru = st ? st.thru : 0;
    const dirty = (fmt.scramble ? [t.id] : t.pids).some(k => ui.drafts[draftKey(day, k)]);
    return `<button class="teambtn" aria-pressed="${t.id === ui.team}" data-act="pick-team" data-id="${esc(t.id)}"><span class="t"><b>TEAM ${i + 1}</b>${esc(t.pids.filter(p => S.players[p]).map(p => S.players[p].name).join(' / '))}</span><span class="thru ${thru === 18 ? 'done' : ''}">${dirty ? 'Unsaved' : thru === 18 ? '✓ 18' : thru ? 'Thru ' + thru : '—'}</span></button>`; }).join('');
  let editor = '';
  const team = teams.find(t => t.id === ui.team);
  if (team) {
    const H = [...Array(18).keys()];
    const head = `<tr><th>Hole</th>${H.slice(0, 9).map(h => `<th>${h + 1}</th>`).join('')}<th class="tot">Out</th>${H.slice(9).map(h => `<th>${h + 1}</th>`).join('')}<th class="tot">In</th><th class="tot">Tot</th></tr>`;
    const meta = (label, arr, total) => `<tr class="meta"><td>${label}</td>${H.slice(0, 9).map(h => `<td>${arr[h]}</td>`).join('')}<td class="tot">${total ? arr.slice(0, 9).reduce((a, b) => a + b, 0) : ''}</td>${H.slice(9).map(h => `<td>${arr[h]}</td>`).join('')}<td class="tot">${total ? arr.slice(9).reduce((a, b) => a + b, 0) : ''}</td><td class="tot">${total ? arr.reduce((a, b) => a + b, 0) : ''}</td></tr>`;
    const rowFor = (key, label, sub, ph) => {
      const vals = cardValues(day, key);
      const tot = (a) => a.reduce((s, v) => s + (Number(v) || 0), 0) || '';
      const cell = (h) => { const p = pops(ph, course.si[h]); return `<td><span class="cell"><input id="sc-${esc(key)}-${h}" data-score="${esc(key)}" data-h="${h}" class="${markClass(vals[h], course.pars[h])}" inputmode="numeric" maxlength="2" value="${esc(vals[h])}" aria-label="${esc(label)} hole ${h + 1}" ${canWrite && mode === 'live' ? '' : 'disabled'}>${p > 0 ? `<span class="pop">${'●'.repeat(p)}</span>` : p < 0 ? '<span class="pop">+</span>' : ''}</span></td>`; };
      return `<tr><td><span class="pname">${esc(label)}</span><span class="pmeta">${sub}</span></td>${H.slice(0, 9).map(cell).join('')}<td class="tot" data-tot="${esc(key)}|out">${tot(vals.slice(0, 9))}</td>${H.slice(9).map(cell).join('')}<td class="tot" data-tot="${esc(key)}|in">${tot(vals.slice(9))}</td><td class="tot" data-tot="${esc(key)}|all">${tot(vals)}</td></tr>`;
    };
    let body = '';
    if (fmt.scramble) {
      const ph = scrambleTeamHcp(S, team.pids, day, team);
      body = rowFor(team.id, 'Team score', `${team.pids.map(p => esc(S.players[p].name.split(' ')[0])).join(' & ')} · team hcp ${ph}`, ph);
    } else {
      body = team.pids.map(pid => {
        const ph = computeDayPH(pid, day);
        const tee = teeName(pid, day);
        return rowFor(pid, S.players[pid].name, `Idx ${Number(S.players[pid].index).toFixed(1)} · CH ${ph} · ${esc(tee)}`, ph);
      }).join('');
      const st = byId[team.id];
      if (st) body += `<tr class="team"><td>${fmt.balls > 1 ? '2 best nets' : 'Best net'}</td>${H.slice(0, 9).map(h => `<td>${st.holes[h] ?? ''}</td>`).join('')}<td class="tot"></td>${H.slice(9).map(h => `<td>${st.holes[h] ?? ''}</td>`).join('')}<td class="tot"></td><td class="tot">${st.thru === 18 ? st.total : ''}</td></tr>`;
    }
    const keys = fmt.scramble ? [team.id] : team.pids;
    const dirty = keys.some(k => ui.drafts[draftKey(day, k)]);
    editor = `<section class="panel"><div class="row between"><h3>Team ${teams.indexOf(team) + 1} card</h3>
      <div class="row">${dirty ? '<span class="pill live">Unsaved changes</span><button class="btn" data-act="discard">Discard</button>' : ''}<button class="btn" data-act="save-card" ${disS()} ${dirty ? '' : 'disabled'}>Save</button><button class="btn primary" data-act="save-next" ${disS()} ${dirty ? '' : 'disabled'}>Save &amp; next team</button></div></div>
      <div class="tbl-wrap"><table class="card"><thead>${head}</thead><tbody>${meta('Par', course.pars, true)}${meta('Hdcp', course.si, false)}${body}</tbody></table></div>
      <div class="muted small">Enter gross scores. Dots mark holes where a player gets a stroke. Circles are birdies, squares are bogeys. The best net row updates after you save. On a computer, press <b>Tab</b> or <b>Enter</b> to move to the next hole.</div></section>`;
  }
  const opts = (sel) => `<option value="">— not entered —</option>` + Object.entries(S.players).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([pid, p]) => `<option value="${pid}" ${pid === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const contests = (dc.contests || []).map(c => `<label class="f">${c.type === 'LD' ? 'Long drive' : 'Closest to pin'} · #${c.hole} · ${fmt$(c.amt)}<select id="ex-${day}-${c.id}" data-extra="${c.id}" ${disS()}>${opts(S.extras[day] && S.extras[day][c.id])}</select></label>`).join('');
  const clearBox = (mode === 'live' && isAdmin() && testToolsOn()) ? (ui.clearing
    ? `<section class="banner" role="alertdialog" aria-labelledby="clr-h"><p id="clr-h"><b>Are you sure?</b> This erases every score entered for Friday, Saturday and Sunday${ui.clearExtras ? ', plus all closest-to-pin and long-drive winners' : ''}. Players, teams and payouts stay. This can't be undone.</p>
        <div class="row"><label class="row small"><input type="checkbox" id="clr-extras" data-clrx="1" ${ui.clearExtras ? 'checked' : ''}> Also clear contest winners</label><button class="btn" data-act="clear-cancel">Cancel</button><button class="btn danger armed" data-act="clear-yes">Yes, clear all scores</button></div></section>`

// ---- events ----
function arm(key) { ui.armed = key; clearTimeout(arm.t); arm.t = setTimeout(() => { ui.armed = null; render(); }, 4000); }

document.getElementById('settingsBtn').addEventListener('click', () => { ui.sheet = { t: 'settings' }; render(); });
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; try { localStorage.setItem('wyd-tab', ui.tab); } catch (x) {}
  render(); try { window.scrollTo(0, 0); } catch (x) {}
});

document.getElementById('main').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, day = b.dataset.day;
  if (act === 'mode-view') { ui.sheet = null; setMode('viewer'); return render(); }
  if (act === 'mode-keep') { ui.sheet = null; setMode('keeper'); render(); if (!canWrite) askPin(); return; }
  if (act === 'mode-admin') { ui.sheet = null; setMode('admin'); render(); if (!isAdmin()) askPin(); return; }
  if (['kday', 'kgroup', 'kback', 'khole', 'khole-fix', 'kprev', 'kminus', 'kplus', 'kmax', 'kout', 'kout-yes', 'kout-no', 'kflag-no', 'ksave', 'kreview', 'kdone', 'kfront-ok', 'kundo', 'kctp-yes', 'kctp-no', 'kchange'].includes(act)) return keepAction(act, b);
  // ---- streamlined views ----
  if (act === 'go') { ui.tab = b.dataset.tab; ui.sheet = null; try { localStorage.setItem('wyd-tab', ui.tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  if (act === 'lday') { ui.lday = day; return render(); }
  if (act === 'msec') { ui.msec = b.dataset.k; return render(); }
  if (act === 'ml-toggle') { const pid = b.dataset.pid; if (window.matchMedia('(min-width: 860px)').matches) { ui.sheet = { t: 'p', pid }; return render(); } ui.mlOpen = ui.mlOpen || {}; ui.mlOpen[pid] = !ui.mlOpen[pid]; return render(); }
  if (act === 'sheet-p') { ui.sheet = { t: 'p', pid: b.dataset.pid }; return render(); }
  if (act === 'sheet-t') { ui.sheet = { t: 'team', day, id: b.dataset.id }; return render(); }
  if (act === 'sheet-close') { ui.sheet = null; return render(); }
  if (act === 'pref') { setPref(b.dataset.k, b.dataset.v); return render(); }
  if (act === 'me-skip') { ui.meSkip = true; return render(); }
  if (act === 'me-set') { setMe(b.dataset.pid || null); toast(b.dataset.pid ? 'Following ' + S.players[b.dataset.pid].name + '.' : 'Stopped following.'); return render(); }
  if (act === 'share-day') {
    const text = daySummaryText(day);
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (x) { return; }
    try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into a text.'); } catch (x) { toast('Could not copy on this device.'); }
